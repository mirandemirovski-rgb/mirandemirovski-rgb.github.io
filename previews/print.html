<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miran Demirovski · CV (PDF layout)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* One-page A4 CV. Same content as the web previews, no animation. */
@page { size: A4; margin: 0; }
:root { --ink: #0e1013; --muted: #5b6168; --line: #d9dcdf; --display: "Archivo", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #e9eaeb; }
body { font: 400 7.95pt/1.37 var(--display); color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page { width: 210mm; height: 297mm; margin: 0 auto; background: #fff; padding: 12mm 12mm 10mm; display: grid; grid-template-rows: auto 1fr auto; gap: 6mm; overflow: hidden; }
@media screen { .page { margin-block: 24px; box-shadow: 0 10px 40px rgba(0,0,0,.12); } }
@media print { html, body { background: #fff; } .page { margin: 0; box-shadow: none; } }
.mono { font-family: var(--mono); font-size: 6.8pt; letter-spacing: .07em; text-transform: uppercase; }
mark.gap { background: none; color: inherit; outline: .6pt dashed currentColor; padding: 0 2pt; }

header { display: grid; grid-template-columns: 27mm 1fr auto; gap: 6mm; align-items: end; padding-bottom: 5mm; border-bottom: 1pt solid var(--ink); }
header img { width: 27mm; height: 32mm; object-fit: cover; object-position: 56% 40%; display: block; }
h1 { margin: 0; font-size: 27pt; line-height: .95; font-weight: 500; font-stretch: 112%; letter-spacing: -.02em; }
.headline { margin: 3mm 0 0; font-size: 9.6pt; }
.now { margin: 2mm 0 0; color: var(--muted); }
.now b { color: var(--ink); font-weight: 500; }
.contact { display: grid; gap: 1.6mm; text-align: right; font-size: 8.4pt; }
.contact a { color: inherit; text-decoration: none; }

.cols { display: grid; grid-template-columns: 56mm 1fr; gap: 8mm; min-height: 0; align-items: start; }
h2 { margin: 0 0 2.2mm; padding-bottom: 1.4mm; border-bottom: .6pt solid var(--ink); }
.side { display: grid; gap: 4.6mm; align-content: start; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm 4mm; }
.facts b { display: block; font-size: 15pt; line-height: 1; font-weight: 400; font-stretch: 115%; }
.facts span { color: var(--muted); font-size: 7.4pt; line-height: 1.3; display: block; margin-top: 1mm; }
.about p { margin: 0 0 1.4mm; }
.skills { display: grid; gap: 1.8mm; }
.skills .g { color: var(--muted); margin-bottom: .8mm; }
.skills p { margin: 0; }
.rows div { display: flex; justify-content: space-between; padding: 1mm 0; border-bottom: .5pt solid var(--line); }
.rows span:last-child { color: var(--muted); }

.jobs { display: grid; gap: 2.7mm; align-content: start; }
.job .top { display: flex; justify-content: space-between; align-items: baseline; gap: 3mm; }
.job .when { color: var(--muted); white-space: nowrap; }
.job h3 { margin: 0; font-size: 9.4pt; font-weight: 600; line-height: 1.25; }
.earlier { margin-top: 1mm; }
.earlier div { display: grid; grid-template-columns: 1fr auto; gap: 3mm; padding: 1.1mm 0; border-bottom: .5pt solid var(--line); }
.earlier b { font-weight: 600; }
.earlier .mono { color: var(--muted); white-space: nowrap; }
.job .co { margin: 0; color: var(--muted); }
.job ul { margin: 1mm 0 0; padding-left: 3.4mm; }
.job li { margin: 0 0 .5mm; }
.job .tags { margin: .8mm 0 0; color: var(--muted); font-size: 7.4pt; }
.hl { display: grid; gap: 1.6mm; }
.trio { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; margin-top: 4.6mm; }
.hl p { margin: 0; }
footer { display: flex; justify-content: space-between; color: var(--muted); border-top: .6pt solid var(--line); padding-top: 2.4mm; }
</style>
</head>
<body>
<div class="page">
  <header>
    <img id="photo" alt="Portrait of Miran Demirovski">
    <div>
      <h1 id="name"></h1>
      <p class="headline" id="headline"></p>
      <p class="now mono" id="now"></p>
    </div>
    <div class="contact" id="contact"></div>
  </header>
  <div class="cols">
    <aside class="side">
      <div><h2 class="mono">Key figures</h2><div class="facts" id="facts"></div></div>
      <div class="about"><h2 class="mono">Profile</h2><div id="about"></div></div>
      <div><h2 class="mono">Highlights</h2><div class="hl" id="hl"></div></div>
      <div><h2 class="mono">Skills</h2><div class="skills" id="skills"></div></div>
    </aside>
    <main><h2 class="mono">Experience</h2><div class="jobs" id="jobs"></div><h2 class="mono earlier-h" style="margin-top:4.6mm">Earlier roles</h2><div class="earlier" id="earlier"></div>
      <div class="trio">
        <div><h2 class="mono">Languages</h2><div class="rows" id="langs"></div></div>
        <div><h2 class="mono">Education</h2><div class="rows" id="edu"></div></div>
      </div></main>
  </div>
  <footer class="mono"><span id="f-name"></span><span id="f-web">mirandemirovski-rgb.github.io</span></footer>
</div>
<script src="assets/cv-data.js"></script>
<script>
(function () {
  var C = window.CV;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function t(s) { return esc(s).replace(/\[\[(.+?)\]\]/g, '<mark class="gap">$1</mark>'); }
  function $(s) { return document.querySelector(s); }
  $("#photo").src = C.photo.bw.replace("../", "");
  $("#name").innerHTML = esc(C.first) + "<br>" + esc(C.last);
  $("#headline").innerHTML = t(C.headline);
  $("#now").innerHTML = "Now — <b>" + t(C.now.title) + ", " + t(C.now.company) + "</b>";
  $("#contact").innerHTML = "<span>" + t(C.location) + '</span><a href="mailto:' + C.email + '">' + t(C.email) + '</a><a href="' + C.linkedin + '">' + t(C.linkedinLabel) + "</a>";
  $("#facts").innerHTML = C.facts.map(function (f) { return "<div><b>" + (f.decimals ? f.value.toFixed(f.decimals) : f.value) + f.suffix + "</b><span>" + t(f.unit + " " + f.label) + "</span></div>"; }).join("");
  $("#about").innerHTML = "<p><b>" + t(C.tagline) + "</b></p><p>" + C.about.map(t).join(" ") + "</p>";
  $("#hl").innerHTML = C.highlights.map(function (h) { return "<p><b>" + t(h.title) + "</b> · " + t(h.when) + "<br>" + t(h.text) + "</p>"; }).join("");
  $("#skills").innerHTML = C.skills.map(function (g) { return '<div><div class="mono g">' + t(g.group) + "</div><p>" + g.items.map(t).join(" · ") + "</p></div>"; }).join("");
  $("#langs").innerHTML = C.languages.map(function (l) { return "<div><span>" + t(l.name) + "</span><span>" + t(l.level) + "</span></div>"; }).join("");
  var e = C.education;
  $("#edu").innerHTML = "<div><span>" + t(e.title) + "</span><span>" + t(e.year) + "</span></div><div><span>" + t(e.school) + "</span><span>" + t(e.place) + "</span></div>";
  var main = C.jobs.filter(function (j) { return j.points.length || j.id === "kaizen"; });
  var older = C.jobs.filter(function (j) { return main.indexOf(j) < 0; });
  $("#earlier").innerHTML = older.map(function (j) { return "<div><span><b>" + t(j.title) + "</b> · " + t(j.company) + '</span><span class="mono">' + t(j.dates) + "</span></div>"; }).join("");
  $("#jobs").innerHTML = main.map(function (j) {
    return '<div class="job"><div class="top"><h3>' + t(j.title) + '</h3><span class="when mono">' + t(j.dates) + '</span></div><div><p class="co">' + t(j.company) + (j.place ? " · " + t(j.place) : "") + "</p>" +
      (j.points.length ? "<ul>" + j.points.map(function (p) { return "<li>" + t(p) + "</li>"; }).join("") + "</ul>" : "") +
      (j.tags.length ? '<p class="tags">' + j.tags.map(t).join(" · ") + "</p>" : "") + "</div></div>";
  }).join("");
  $("#f-name").textContent = C.first + " " + C.last + " · CV";
})();
</script>
</body>
</html>
