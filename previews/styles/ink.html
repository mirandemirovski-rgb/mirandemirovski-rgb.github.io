<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miran Demirovski · Ink</title>
<meta name="description" content="Miran Demirovski — Real-Time Analysis, Workforce Management and Team Leadership. Athens, Greece.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Mrs+Saint+Delafield&family=Caveat:wght@500&display=swap">
<link rel="stylesheet" href="../assets/core.css">
<style>
/* Layout: a written page. A margin column for pen notes, a text column set in a book face, a signature at both ends. */
@property --r1 { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
@property --r2 { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
@property --r3 { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
@property --fill { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
:root {
  --paper: #fdfdfb;
  --ink: #12141a;
  --muted: #676a72;
  --rule: rgba(18, 20, 26, .12);
  --pen: #24409a;
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --sign: "Mrs Saint Delafield", "Snell Roundhand", cursive;
  --hand: "Caveat", "Segoe Print", cursive;
  --pv-bg: #12141a; --pv-fg: #fdfdfb; --pv-line: rgba(255,255,255,.1);
  --gut: clamp(16px, 5vw, 64px);
  --margin: clamp(0px, 15vw, 190px);
  color-scheme: light;
}
body { background: var(--paper); color: var(--ink); font: 400 18px/1.62 var(--serif); font-optical-sizing: auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.caps { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 500; }
.page { position: relative; max-width: 1180px; margin: 0 auto; padding-inline: var(--gut); }

/* Effect 1: margin lines draw themselves */
.mline { position: absolute; top: 0; bottom: 0; left: calc(var(--gut) + var(--margin) - 28px); width: 1px; background: rgba(36, 64, 154, .28); transform-origin: top; pointer-events: none; }
.js .mline { transform: scaleY(0); animation: grow 2.4s cubic-bezier(.6,.05,.3,1) .1s forwards; }
.hline { height: 1px; background: var(--rule); transform-origin: left; }
.js .hline { transform: scaleX(0); animation: growx 1.6s cubic-bezier(.6,.05,.3,1) .3s forwards; }
@keyframes grow { to { transform: none; } }
@keyframes growx { to { transform: none; } }

.row { display: grid; grid-template-columns: var(--margin) minmax(0, 1fr); }
.margin { position: relative; padding-right: 40px; min-width: 0; }
.col { min-width: 0; }

/* ---------- Hero ---------- */
.hero { padding-block: clamp(36px, 6vw, 72px) clamp(40px, 6vw, 88px); }
.hero .top { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); padding-bottom: 14px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: clamp(28px, 5vw, 72px); align-items: center; padding-top: clamp(24px, 4vw, 48px); }
.sig-wrap { position: relative; }
/* Effect 2: signature written stroke by stroke */
.sig { width: 100%; height: auto; overflow: visible; display: block; }
.sig text { font-family: var(--sign); font-size: 150px; fill: var(--ink); stroke: var(--ink); stroke-width: .8; vector-effect: non-scaling-stroke; }
.js .sig text { fill-opacity: 0; stroke-dasharray: 900; stroke-dashoffset: 900; }
.js .sig.go text { animation: sigdraw 2.6s cubic-bezier(.45,.1,.35,1) forwards, sigfill 1s ease 1.9s forwards; }
.js .sig .wipe { transform: scaleX(0); transform-origin: left; transform-box: fill-box; }
.js .sig.go .wipe { animation: wipe 2.4s cubic-bezier(.5,.1,.35,1) forwards; }
.sig .swash { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.js .sig .swash { stroke-dasharray: 1; stroke-dashoffset: 1; }
.js .sig.go .swash { animation: draw .9s cubic-bezier(.5,.1,.3,1) 2.3s forwards; }
@keyframes sigdraw { to { stroke-dashoffset: 0; } }
@keyframes sigfill { to { fill-opacity: 1; } }
@keyframes wipe { to { transform: none; } }
@keyframes draw { to { stroke-dashoffset: 0; } }

.typeset { margin: 6px 0 0; font-size: clamp(15px, 1.4vw, 17px); letter-spacing: .32em; text-transform: uppercase; font-weight: 500; }
.headline { margin: 22px 0 0; font-size: clamp(22px, 2.3vw, 30px); line-height: 1.25; font-weight: 300; font-style: italic; max-width: 26ch; text-wrap: balance; }
.now { margin: 18px 0 0; color: var(--muted); font-size: 16px; }
.now b { color: var(--ink); font-weight: 500; }
.js .late { opacity: 0; transform: translateY(8px); animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--d); }
@keyframes rise { to { opacity: 1; transform: none; } }

.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.btn { font: 500 15px/1 var(--serif); letter-spacing: .02em; text-decoration: none; padding: 14px 20px; border: 1px solid var(--ink); border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; transition: background .3s ease, color .3s ease, transform .35s cubic-bezier(.2,.8,.2,1); will-change: transform; }
.btn.solid { background: var(--ink); color: var(--paper); }
.btn:hover { background: var(--ink); color: var(--paper); }
.btn.solid:hover { background: var(--paper); color: var(--ink); }

/* Effect 3: photo spreads in like ink */
.photo { margin: 0; position: relative; min-width: 0; }
.photo .img { aspect-ratio: 4 / 5; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: 56% 40%; filter: contrast(1.08); }
.js .photo .img {
  -webkit-mask-image: radial-gradient(circle at 58% 40%, #000 var(--r1), transparent calc(var(--r1) + 9%)), radial-gradient(circle at 28% 78%, #000 var(--r2), transparent calc(var(--r2) + 9%)), radial-gradient(circle at 82% 84%, #000 var(--r3), transparent calc(var(--r3) + 9%));
  mask-image: radial-gradient(circle at 58% 40%, #000 var(--r1), transparent calc(var(--r1) + 9%)), radial-gradient(circle at 28% 78%, #000 var(--r2), transparent calc(var(--r2) + 9%)), radial-gradient(circle at 82% 84%, #000 var(--r3), transparent calc(var(--r3) + 9%));
  animation: spread1 3.2s cubic-bezier(.3,.1,.25,1) 1s forwards, spread2 2.8s cubic-bezier(.3,.1,.25,1) 1.5s forwards, spread3 2.6s cubic-bezier(.3,.1,.25,1) 1.8s forwards;
}
@keyframes spread1 { to { --r1: 120%; } }
@keyframes spread2 { to { --r2: 90%; } }
@keyframes spread3 { to { --r3: 80%; } }
.photo figcaption { margin-top: 12px; display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; font-style: italic; }

/* ---------- Sections ---------- */
section { padding-block: clamp(56px, 8vw, 104px) 0; }
.sec-title { display: flex; align-items: baseline; gap: 18px; margin: 0 0 clamp(24px, 4vw, 40px); }
/* Effect 6: outlined numerals fill with ink */
.numeral { font-size: clamp(64px, 9vw, 120px); line-height: 1.05; margin-bottom: -.12em; font-style: italic; font-weight: 300; color: transparent; -webkit-text-stroke: 1px var(--ink); background: linear-gradient(to top, var(--ink) var(--fill), transparent var(--fill)); -webkit-background-clip: text; background-clip: text; }
.js .numeral { transition: --fill 1.8s cubic-bezier(.4,.1,.2,1) .2s; }
.js .in .numeral, html:not(.js) .numeral { --fill: 100%; }
h2 { margin: 0; font-size: clamp(30px, 4vw, 48px); line-height: 1.05; font-weight: 400; letter-spacing: -.01em; }

/* Effect 7: margin notes in pen */
.note { font-family: var(--hand); font-weight: 500; font-size: 21px; line-height: 1.1; color: var(--pen); transform: rotate(-3deg); display: block; text-align: right; }
.js .note { clip-path: inset(0 100% 0 0); transition: clip-path 1.2s cubic-bezier(.5,.1,.3,1) .5s; }
.js .in .note, .js .note.in { clip-path: inset(-20% -5% -20% -5%); }
.note .arrow { display: inline-block; margin-left: 4px; }

/* Effect 4 + 5: about, word by word, with underlines */
.about-lead { margin: 0 0 22px; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.3; font-weight: 300; max-width: 30ch; }
.about-body { max-width: 62ch; }
.about-body p { margin: 0 0 12px; }
/* Effect 10: drop cap writes itself */
.dropcap { float: left; width: .78em; height: 1.1em; margin: .08em .06em 0 -.04em; overflow: visible; font-size: 74px; }
.dropcap text { font-family: var(--serif); font-size: 100px; font-style: italic; font-weight: 400; fill: var(--ink); stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; }
.js .dropcap text { fill-opacity: 0; stroke-dasharray: 600; stroke-dashoffset: 600; }
.js .in .dropcap text { transition: stroke-dashoffset 1.6s cubic-bezier(.5,.1,.3,1), fill-opacity .8s ease 1.3s; stroke-dashoffset: 0; fill-opacity: 1; }
.js .w { display: inline-block; opacity: 0; filter: blur(5px); transform: translateY(3px); transition: opacity .7s ease, filter .8s ease, transform .8s ease; transition-delay: calc(var(--i) * 28ms + .3s); }
.js .in .w { opacity: 1; filter: none; transform: none; }
.uline { position: relative; white-space: nowrap; }
.uline svg { position: absolute; left: -2%; bottom: -.32em; width: 104%; height: .5em; overflow: visible; pointer-events: none; }
.uline path { fill: none; stroke: var(--pen); stroke-width: 1.6; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.js .uline path { stroke-dasharray: 1; stroke-dashoffset: 1; }
.js .in .uline path { transition: stroke-dashoffset 1s cubic-bezier(.5,.1,.3,1); transition-delay: var(--ud, 1.6s); stroke-dashoffset: 0; }

/* Facts */
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.fact { min-width: 0; }
.fact .num { display: inline-block; position: relative; font-size: clamp(48px, 6vw, 80px); line-height: 1; font-style: italic; font-weight: 300; font-variant-numeric: lining-nums; }
.fact .num svg { position: absolute; left: -4%; right: -4%; bottom: -12px; width: 108%; height: 14px; overflow: visible; }
.fact .num path { fill: none; stroke: var(--pen); stroke-width: 1.6; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.js .fact .num path { stroke-dasharray: 1; stroke-dashoffset: 1; }
.js .fact.in .num path { transition: stroke-dashoffset 1s cubic-bezier(.5,.1,.3,1) 1.2s; stroke-dashoffset: 0; }
.fact p { margin: 16px 0 0; color: var(--muted); font-size: 16px; line-height: 1.4; }
.fact .unit { color: var(--ink); font-style: italic; }

/* Effect 8: the career as one ink line */
.career { position: relative; }
.inkline { position: absolute; left: -36px; top: 0; width: 40px; overflow: visible; pointer-events: none; }
.inkline path { fill: none; stroke: var(--ink); stroke-width: 1.3; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.inkline circle { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.job { position: relative; padding: 0 0 34px; }
.job .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 15px; font-style: italic; }
.job h3 { margin: 4px 0 2px; font-size: clamp(22px, 2.3vw, 28px); line-height: 1.2; font-weight: 500; }
.job .co { margin: 0; font-size: 17px; }
.job ul { margin: 10px 0 0; padding: 0 0 0 18px; max-width: 64ch; font-size: 17px; }
.job li { margin: 0 0 5px; }
.job li::marker { content: "– "; color: var(--muted); }
.job .tags { margin: 8px 0 0; color: var(--muted); font-size: 15px; font-style: italic; }
.js .job .body { opacity: 0; transform: translateX(-8px); transition: opacity .8s ease, transform .9s cubic-bezier(.2,.8,.2,1); }
.js .job.in .body { opacity: 1; transform: none; }
.job .margin-note { position: absolute; right: calc(100% + 64px); top: 2px; width: calc(var(--margin) - 48px); }

/* Effect 9: hand-drawn circle around the award */
.hl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; }
.hl-item { min-width: 0; }
.hl-item .when { color: var(--muted); font-style: italic; }
.hl-item h3 { margin: 6px 0 8px; font-size: 26px; line-height: 1.2; font-weight: 500; display: inline-block; position: relative; }
.hl-item p { margin: 0; max-width: 40ch; }
.circle { position: absolute; left: -6%; top: -48%; width: 112%; height: 196%; overflow: visible; pointer-events: none; }
.circle path { fill: none; stroke: var(--pen); stroke-width: 1.7; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.js .circle path { stroke-dasharray: 1; stroke-dashoffset: 1; }
.js .in .circle path { transition: stroke-dashoffset 1.4s cubic-bezier(.5,.1,.3,1) .5s; stroke-dashoffset: 0; }

.skills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 48px; }
.skill-group h3 { margin: 0 0 6px; font-size: 21px; font-style: italic; font-weight: 400; }
.skill-group p { margin: 0; font-size: 18px; line-height: 1.55; }
.skill-group .sep { color: var(--muted); }

.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px; }
.list { margin: 0; padding: 0; list-style: none; }
.list li { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.list li span:last-child { color: var(--muted); font-style: italic; }

/* Effect 12: signature at the end */
.end { padding-bottom: 140px; }
.mail { font-size: clamp(26px, 4.4vw, 54px); line-height: 1.1; font-style: italic; font-weight: 300; text-decoration: none; overflow-wrap: anywhere; background: linear-gradient(var(--ink), var(--ink)) left bottom / 100% 1px no-repeat; }
.mail:hover { color: var(--pen); background-image: linear-gradient(var(--pen), var(--pen)); }
.end .meta { margin-top: 18px; color: var(--muted); display: grid; gap: 4px; }
.end .meta a { text-decoration: none; overflow-wrap: anywhere; }
.end .meta a:hover { color: var(--ink); }
.sig-end { max-width: 360px; margin-top: 40px; }

.js .fade { opacity: 0; transform: translateY(10px); transition: opacity .9s ease, transform .9s cubic-bezier(.2,.8,.2,1); }
.js .fade.in { opacity: 1; transform: none; }

@media (max-width: 900px) {
  :root { --margin: 0px; }
  .mline { display: none; }
  .row { grid-template-columns: minmax(0, 1fr); }
  .margin { display: none; }
  .hero-grid { grid-template-columns: minmax(0, 1fr); }
  .photo { max-width: 480px; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px 24px; }
  .hl, .skills, .two { grid-template-columns: minmax(0, 1fr); }
  .career { padding-left: 34px; }
  .inkline { left: -2px; }
  .job .margin-note { position: static; width: auto; margin-bottom: 6px; }
  .job .margin-note .note { text-align: left; transform: rotate(-2deg); font-size: 19px; }
}
@media print { .mline { display: none; } }
</style>
</head>
<body>
<div class="page">
  <span class="mline" aria-hidden="true"></span>

  <header class="hero" id="top">
    <div class="row"><div class="margin"></div><div class="col">
      <div class="top caps"><span>Curriculum vitae</span><span id="loc"></span></div>
      <div class="hline"></div>
      <div class="hero-grid">
        <div>
          <h1 class="sr" id="name"></h1>
          <div class="sig-wrap"><svg class="sig" id="sig" aria-hidden="true"></svg></div>
          <p class="typeset late" id="typeset" style="--d:2.4s"></p>
          <p class="headline late" id="headline" style="--d:2.7s"></p>
          <p class="now late" id="now" style="--d:2.9s"></p>
          <div class="cta late" id="cta" style="--d:3.1s"></div>
        </div>
        <figure class="photo">
          <div class="img"><img id="photo" alt="Portrait of Miran Demirovski" width="959" height="960"></div>
          <figcaption class="late" style="--d:3.6s"><span>Miran, Athens</span><span id="cap-role"></span></figcaption>
        </figure>
      </div>
    </div></div>
  </header>

  <main>
    <section class="row" id="s-facts">
      <div class="margin"><span class="note fade" id="note-facts">counted from LinkedIn</span></div>
      <div class="col">
        <div class="sec-title"><span class="numeral" aria-hidden="true">i</span><h2>In short</h2></div>
        <div class="facts" id="facts"></div>
      </div>
    </section>

    <section class="row" id="s-about">
      <div class="margin"></div>
      <div class="col">
        <div class="sec-title"><span class="numeral" aria-hidden="true">ii</span><h2>Profile</h2></div>
        <div id="about"></div>
      </div>
    </section>

    <section class="row" id="s-exp">
      <div class="margin"></div>
      <div class="col">
        <div class="sec-title"><span class="numeral" aria-hidden="true">iii</span><h2>Experience</h2></div>
        <div class="career" id="career"><svg class="inkline" id="inkline" aria-hidden="true"></svg></div>
      </div>
    </section>

    <section class="row" id="s-hl">
      <div class="margin"></div>
      <div class="col">
        <div class="sec-title"><span class="numeral" aria-hidden="true">iv</span><h2>Highlights</h2></div>
        <div class="hl" id="hl"></div>
      </div>
    </section>

    <section class="row" id="s-skills">
      <div class="margin"></div>
      <div class="col">
        <div class="sec-title"><span class="numeral" aria-hidden="true">v</span><h2>Skills</h2></div>
        <div class="skills" id="skills"></div>
      </div>
    </section>

    <section class="row" id="s-more">
      <div class="margin"></div>
      <div class="col">
        <div class="sec-title"><span class="numeral" aria-hidden="true">vi</span><h2>Languages &amp; education</h2></div>
        <div class="two"><ul class="list" id="langs"></ul><ul class="list" id="edu"></ul></div>
      </div>
    </section>

    <section class="row end" id="s-end">
      <div class="margin"><span class="note fade">write to me <span class="arrow">→</span></span></div>
      <div class="col">
        <div class="sec-title"><span class="numeral" aria-hidden="true">vii</span><h2>Contact</h2></div>
        <a class="mail" id="mail"></a>
        <div class="meta" id="meta"></div>
        <div class="cta" id="cta2"></div>
        <svg class="sig sig-end" id="sig-end" aria-hidden="true"></svg>
      </div>
    </section>
  </main>
</div>

<script src="../assets/cv-data.js"></script>
<script src="../assets/core.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CV, K = window.Core, t = K.t, $ = K.$, $$ = K.$$;

  /* ---------- Content ---------- */
  var full = C.first + " " + C.last;
  $("#name").textContent = full;
  $("#loc").textContent = C.location;
  $("#typeset").textContent = full;
  $("#headline").innerHTML = t(C.headline);
  $("#now").innerHTML = "Now <b>" + t(C.now.title) + "</b> at <b>" + t(C.now.company) + "</b>";
  $("#cap-role").innerHTML = t(C.now.company);
  $("#photo").src = C.photo.bw;
  function ctas() {
    return '<a class="btn solid mag" href="' + C.pdf + '">Download PDF</a>' +
      '<a class="btn mag" href="mailto:' + C.email + '">Email</a>' +
      '<a class="btn mag" href="' + C.linkedin + '" target="_blank" rel="noopener">LinkedIn ↗</a>';
  }
  $("#cta").innerHTML = ctas();
  $("#cta2").innerHTML = ctas();

  var under = '<svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M2 6 C 20 3, 38 8, 55 5 S 88 3, 98 6"/></svg>';
  $("#facts").innerHTML = C.facts.map(function (f) {
    return '<div class="fact"><span class="num" data-to="' + f.value + '" data-dec="' + f.decimals + '" data-suf="' + f.suffix + '"><span class="v">0</span>' + under + '</span><p><span class="unit">' + t(f.unit) + "</span> " + t(f.label) + "</p></div>";
  }).join("");

  // About: drop cap + words + pen underlines on key phrases
  var keys = ["real-time analysis", "workforce management", "team leadership"];
  var first = C.about[0];
  var body = C.about.map(function (p, pi) {
    var txt = pi === 0 ? p.slice(1) : p, i = 0;
    var html = K.esc(txt).split(/(\s+)/).map(function (w) { return /^\s+$/.test(w) ? w : '<span class="w" style="--i:' + (pi * 30 + i++) + '">' + w + "</span>"; }).join("");
    keys.forEach(function (k, ki) {
      var re = new RegExp(k.split(" ").map(function (w) { return '(<span class="w" style="--i:\\d+">' + w.replace(/[-]/g, "\\-") + "[,.]?</span>)"; }).join("(\\s+)"));
      html = html.replace(re, function (m) { return '<span class="uline" style="--ud:' + (1.5 + ki * .5) + 's">' + m + under + "</span>"; });
    });
    return "<p>" + (pi === 0 ? '<svg class="dropcap" viewBox="2 -76 62 98" aria-hidden="true"><text x="0" y="0">' + K.esc(first[0]) + '</text></svg><span class="sr">' + K.esc(first[0]) + "</span>" : "") + html + "</p>";
  }).join("");
  $("#about").innerHTML = '<p class="about-lead fade">' + t(C.tagline) + '</p><div class="about-body">' + body + "</div>";

  var career = $("#career"), seen = {};
  C.jobs.forEach(function (j, i) {
    var note = "";
    if (i === 0) note = "now";
    else if (j.id === "ttec-tl") note = "led the Croatian team";
    else if (C.tenure[j.company] && !seen[j.company]) note = C.tenure[j.company] + " at " + j.company;
    else if (j.id === "data") note = "before contact centres";
    seen[j.company] = true;
    var a = document.createElement("article");
    a.className = "job";
    a.innerHTML = (note ? '<div class="margin-note"><span class="note">' + K.esc(note) + "</span></div>" : "") +
      '<div class="body"><div class="meta"><span>' + t(j.dates) + "</span>" + (j.place ? "<span>" + t(j.place) + "</span>" : "") + "</div>" +
      "<h3>" + t(j.title) + '</h3><p class="co">' + t(j.company) + "</p>" +
      (j.points.length ? "<ul>" + j.points.map(function (p) { return "<li>" + t(p) + "</li>"; }).join("") + "</ul>" : "") +
      (j.tags.length ? '<p class="tags">' + j.tags.map(t).join(", ") + "</p>" : "") + "</div>";
    career.appendChild(a);
  });

  var circ = '<svg class="circle" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M60 8 C 86 8, 99 26, 98 50 C 97 78, 74 94, 46 93 C 18 92, 2 76, 3 50 C 4 24, 24 6, 52 6 C 62 6, 70 9, 74 13"/></svg>';
  $("#hl").innerHTML = C.highlights.map(function (h, i) {
    return '<div class="hl-item fade"><div class="when">' + t(h.when) + "</div><h3>" + t(h.title) + (i === 0 ? circ : "") + "</h3><p>" + t(h.text) + "</p></div>";
  }).join("");

  $("#skills").innerHTML = C.skills.map(function (g) {
    return '<div class="skill-group fade"><h3>' + t(g.group) + "</h3><p>" + g.items.map(t).join('<span class="sep"> · </span>') + "</p></div>";
  }).join("");
  $("#langs").innerHTML = C.languages.map(function (l) { return "<li><span>" + t(l.name) + "</span><span>" + t(l.level) + "</span></li>"; }).join("");
  var e = C.education;
  $("#edu").innerHTML = "<li><span>" + t(e.title) + "</span><span>" + t(e.year) + "</span></li><li><span>" + t(e.school) + "</span><span>" + t(e.place) + "</span></li>";
  var mail = $("#mail"); mail.href = "mailto:" + C.email; mail.textContent = C.email;
  $("#meta").innerHTML = "<span>" + t(C.location) + '</span><a href="' + C.linkedin + '" target="_blank" rel="noopener">' + t(C.linkedinLabel) + "</a>";

  /* ---------- Effect 2 + 12: signatures ---------- */
  function signature(svg, delay) {
    svg.innerHTML = '<defs><clipPath id="' + svg.id + '-c"><rect class="wipe" x="-40" y="-200" width="1400" height="400"/></clipPath></defs>' +
      '<g clip-path="url(#' + svg.id + '-c)"><text x="0" y="0">' + K.esc(full) + "</text></g>" +
      '<path class="swash" pathLength="1" d=""/>';
    function fit() {
      var tx = $("text", svg), b;
      try { b = tx.getBBox(); } catch (err) { b = { x: 0, y: -120, width: 900, height: 160 }; }
      var y = b.y + b.height * 0.86;
      $(".swash", svg).setAttribute("d", "M" + (b.x + b.width * 0.08) + " " + y + " C " + (b.x + b.width * 0.4) + " " + (y + 18) + ", " + (b.x + b.width * 0.75) + " " + (y - 8) + ", " + (b.x + b.width * 1.02) + " " + (y - 2));
      svg.setAttribute("viewBox", (b.x - 10) + " " + (b.y - 6) + " " + (b.width + 30) + " " + (b.height + 30));
    }
    fit();
    return function go() {
      fit();
      setTimeout(function () { svg.classList.add("go"); }, delay || 0);
    };
  }
  var goTop = signature($("#sig"), K.reduced ? 0 : 500);
  var goEnd = signature($("#sig-end"), 200);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () {
    goTop();
    K.onView($("#sig-end"), goEnd, { threshold: 0.6 });
  });

  /* ---------- Reveals ---------- */
  K.reveal($$(".row"), { threshold: 0.12 });
  K.reveal($$(".fade"), { threshold: 0.3 });
  K.reveal($$(".job"), { threshold: 0.3 });
  K.reveal($("#about"), { threshold: 0.25 });
  K.onView($$(".fact"), function (f) {
    f.classList.add("in");
    var n = $(".num", f);
    K.countUp($(".v", n), +n.dataset.to, { decimals: +n.dataset.dec, suffix: n.dataset.suf, duration: 1700 });
  }, { threshold: 0.5 });

  /* ---------- Effect 8: one continuous ink line through the career ---------- */
  var ink = $("#inkline"), path, len = 0;
  function buildInk() {
    var jobs = $$(".job", career), h = career.offsetHeight, pts = [];
    jobs.forEach(function (j, i) { pts.push([i % 2 ? 22 : 14, j.offsetTop + 14]); });
    if (!pts.length) return;
    var d = "M18 0 L18 " + Math.max(0, pts[0][1] - 30) + " Q " + pts[0][0] + " " + (pts[0][1] - 14) + " " + pts[0][0] + " " + pts[0][1];
    for (var i = 1; i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i], my = (a[1] + b[1]) / 2;
      d += " C " + a[0] + " " + (my - 10) + ", " + b[0] + " " + (my + 10) + ", " + b[0] + " " + b[1];
    }
    d += " L " + pts[pts.length - 1][0] + " " + (h - 10);
    ink.setAttribute("viewBox", "0 0 40 " + h);
    ink.style.height = h + "px";
    ink.innerHTML = '<path d="' + d + '"/>' + pts.map(function (p) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4"/>'; }).join("");
    path = $("path", ink); len = path.getTotalLength();
    path.style.strokeDasharray = len; path.style.strokeDashoffset = K.reduced ? 0 : len;
    $$("circle", ink).forEach(function (c) { c.style.opacity = K.reduced ? 1 : 0; c.style.transition = "opacity .4s ease"; });
  }
  buildInk();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(buildInk);
  window.addEventListener("resize", buildInk);
  K.onScroll(function () {
    if (!path || K.reduced) return;
    var p = K.progress(career, 0.8, 0.6);
    path.style.strokeDashoffset = len * (1 - p);
    var drawnY = career.offsetHeight * p;
    $$("circle", ink).forEach(function (c) { c.style.opacity = +c.getAttribute("cy") <= drawnY + 4 ? 1 : 0; });
  });

  /* ---------- Effect 11: buttons lean towards the pointer ---------- */
  if (K.finePointer && !K.reduced) {
    $$(".mag").forEach(function (b) {
      b.addEventListener("mousemove", function (ev) {
        var r = b.getBoundingClientRect();
        var x = (ev.clientX - r.left - r.width / 2) * 0.18, y = (ev.clientY - r.top - r.height / 2) * 0.28;
        b.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
      });
      b.addEventListener("mouseleave", function () { b.style.transform = ""; });
    });
  }

  K.previewBar("ink");
})();
</script>
</body>
</html>
