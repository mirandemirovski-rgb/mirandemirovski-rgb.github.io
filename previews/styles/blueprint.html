<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miran Demirovski · Blueprint</title>
<meta name="description" content="Miran Demirovski — Real-Time Analysis, Workforce Management and Team Leadership. Athens, Greece.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/core.css">
<style>
/* Layout: a technical drawing sheet. Grid paper, dimension lines, a title block at the end. */
:root {
  --paper: #f6f7f7;
  --ink: #0e1013;
  --muted: #5b6168;
  --grid: rgba(14, 16, 19, .055);
  --grid-strong: rgba(14, 16, 19, .12);
  --dim: #2848c8;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --pv-bg: #0e1013; --pv-fg: #f6f7f7; --pv-line: rgba(255,255,255,.1);
  --gut: clamp(16px, 5vw, 64px);
  --max: 1180px;
  color-scheme: light;
}
body {
  background: var(--paper);
  color: var(--ink);
  font: 400 16px/1.6 var(--display);
  font-stretch: 100%;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }

/* Effect 11 / 12: page grid paper (fades in after the hero grid, fades out at the end) */
.paper {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    linear-gradient(var(--grid-strong) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  background-position: -1px -1px;
  opacity: 0;
  transition: opacity 1.6s ease;
}
.grid-on .paper { opacity: 1; }
.complete .paper { opacity: .25; }

.wrap { max-width: var(--max); margin: 0 auto; padding-inline: var(--gut); }

/* ---------- Hero ---------- */
.hero { position: relative; padding-block: clamp(56px, 9vw, 112px) clamp(40px, 6vw, 80px); overflow: hidden; }
.hero-grid { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hero-grid line { stroke: var(--grid-strong); stroke-width: 1; vector-effect: non-scaling-stroke; }
.js .hero-grid line { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: drawline 1.1s cubic-bezier(.6,.05,.25,1) forwards; animation-delay: var(--d); }
@keyframes drawline { to { stroke-dashoffset: 0; } }

/* Effect 2: registration corner marks */
.corner { position: absolute; width: 22px; height: 22px; border-color: var(--ink); border-style: solid; border-width: 0; }
.corner.tl { top: 18px; left: 18px; border-top-width: 1px; border-left-width: 1px; }
.corner.tr { top: 18px; right: 18px; border-top-width: 1px; border-right-width: 1px; }
.corner.bl { bottom: 18px; left: 18px; border-bottom-width: 1px; border-left-width: 1px; }
.corner.br { bottom: 18px; right: 18px; border-bottom-width: 1px; border-right-width: 1px; }
.js .corner { opacity: 0; transform: scale(1.8); animation: corner .7s cubic-bezier(.2,.8,.2,1) .35s forwards; }
@keyframes corner { to { opacity: 1; transform: none; } }

.hero-inner { position: relative; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .9fr); gap: clamp(28px, 5vw, 72px); align-items: end; }
.hero-text { min-width: 0; display: grid; gap: 22px; }
.sheet-label { color: var(--dim); display: flex; gap: 12px; align-items: center; }
.sheet-label::before { content: ""; width: 28px; height: 1px; background: currentColor; }

/* Effect 3: name drawn as an outline, then filled */
.name { margin: 0; line-height: 0; }
.name-svg { width: 100%; height: auto; overflow: visible; display: block; }
.name-svg text { font-family: var(--display); font-size: 100px; font-weight: 500; font-stretch: 112%; letter-spacing: -2px; fill: var(--ink); stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; }
.js .name-svg text { fill-opacity: 0; }
.js .name-svg tspan { stroke-dasharray: 700; stroke-dashoffset: 700; }
.js .name-svg.go tspan { animation: drawname 1.5s cubic-bezier(.45,.05,.3,1) forwards; animation-delay: calc(var(--d) + .65s); }
.js .name-svg.go text { animation: fillname .9s ease forwards; animation-delay: 2s; }
@keyframes drawname { to { stroke-dashoffset: 0; } }
@keyframes fillname { to { fill-opacity: 1; } }

.headline { margin: 0; font-size: clamp(17px, 1.7vw, 21px); line-height: 1.45; font-weight: 400; max-width: 34ch; text-wrap: balance; }
.now { color: var(--muted); display: grid; gap: 6px; }
.now b { color: var(--ink); font-weight: 500; }
.js .fade-late { opacity: 0; transform: translateY(8px); animation: up .8s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--d, 2.4s); }
@keyframes up { to { opacity: 1; transform: none; } }

.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  font: 500 13px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; text-decoration: none;
  padding: 13px 16px; border: 1px solid var(--ink); display: inline-flex; gap: 10px; align-items: center;
  background: transparent; transition: background .25s ease, color .25s ease;
}
.btn.solid, .btn:hover { background: var(--ink); color: var(--paper); }
.btn.solid:hover { background: transparent; color: var(--ink); }

/* Effect 4: photo uncovered by a scan line, then developed */
.photo { position: relative; margin: 0; min-width: 0; }
.photo-frame { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--paper); outline: 1px solid var(--ink); outline-offset: 8px; }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: 56% 40%; filter: contrast(1.06); }
.js .photo img { filter: brightness(2.7) contrast(.25); animation: develop 2.2s ease 1.9s forwards; }
@keyframes develop { to { filter: brightness(1) contrast(1.06); } }
.photo .cover { position: absolute; inset: 0; background: var(--paper); transform-origin: bottom; }
.photo .scan { position: absolute; left: -8px; right: -8px; top: 0; height: 1px; background: var(--dim); box-shadow: 0 0 0 .5px var(--dim); }
.js .photo .cover { animation: uncover 1.9s cubic-bezier(.6,.05,.3,1) 1.25s forwards; }
.js .photo .scan { animation: scan 1.9s cubic-bezier(.6,.05,.3,1) 1.25s forwards, fadeout .4s ease 3.15s forwards; }
html:not(.js) .photo .cover, html:not(.js) .photo .scan { display: none; }
@keyframes uncover { to { transform: scaleY(0); } }
@keyframes scan { to { transform: translateY(var(--h, 400px)); } }
@keyframes fadeout { to { opacity: 0; } }
.photo figcaption { margin-top: 18px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; }
/* dimension line beside the photo */
.photo .vdim { position: absolute; top: 0; bottom: 0; right: -26px; width: 9px; border-block: 1px solid var(--dim); }
.photo .vdim::before { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 1px; background: var(--dim); }
.js .photo .vdim { opacity: 0; animation: up .6s ease 3.2s forwards; }

/* ---------- Sections ---------- */
section { padding-block: clamp(56px, 8vw, 104px) 0; }
/* Effect 6: dimension line that measures each section */
.dim { position: relative; display: flex; align-items: center; gap: 14px; color: var(--dim); margin-bottom: clamp(28px, 4vw, 44px); }
.dim .line { position: relative; flex: 1; height: 9px; }
.dim .line::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 1px; background: currentColor; transform-origin: left; }
.dim .line::after { content: ""; position: absolute; right: 0; top: 0; height: 9px; width: 1px; background: currentColor; }
.dim .tick { width: 1px; height: 9px; background: currentColor; }
.js .dim .line::before { transform: scaleX(0); transition: transform 1.1s cubic-bezier(.6,.05,.25,1) .1s; }
.js .dim .line::after { opacity: 0; transition: opacity .3s ease 1.1s; }
.js .dim.in .line::before { transform: none; }
.js .dim.in .line::after { opacity: 1; }

/* Effect 5: section titles type themselves */
h2 { margin: 0 0 clamp(24px, 4vw, 40px); font-size: clamp(30px, 4.6vw, 56px); line-height: 1.02; font-weight: 500; font-stretch: 112%; letter-spacing: -.02em; min-height: 1.02em; }
.caret { display: inline-block; width: .06em; height: .82em; margin-left: .06em; background: var(--dim); vertical-align: -.05em; animation: blink .9s steps(1) 3 forwards; }
@keyframes blink { 50% { opacity: 0; } 100% { opacity: 0; } }

/* Effect 9: figures that count up over a ruler */
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--ink); }
.fact { padding: 22px 20px 26px 0; border-right: 1px solid var(--grid-strong); display: grid; gap: 10px; align-content: start; min-width: 0; }
.fact + .fact { padding-left: 20px; }
.fact:last-child { border-right: 0; }
.fact .num { font-size: clamp(44px, 6vw, 76px); line-height: 1; font-weight: 300; font-stretch: 118%; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.fact .unit { color: var(--dim); }
.fact .lbl { color: var(--muted); font-size: 15px; line-height: 1.4; }
.ruler { height: 10px; background-image: repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 8px), repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 40px); background-size: 100% 5px, 100% 10px; background-repeat: no-repeat; background-position: bottom left; }
.js .ruler { clip-path: inset(0 100% 0 0); transition: clip-path 1.6s cubic-bezier(.3,.6,.2,1); }
.js .fact.in .ruler { clip-path: inset(0 0 0 0); }

.about { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: clamp(24px, 5vw, 72px); }
.about .lead { margin: 0; font-size: clamp(22px, 2.6vw, 32px); line-height: 1.25; font-weight: 400; font-stretch: 108%; letter-spacing: -.01em; text-wrap: balance; }
.about .body { display: grid; gap: 14px; font-size: 17px; max-width: 62ch; }
.about .body p { margin: 0; }
.js .about .body p { opacity: 0; transform: translateY(10px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1); transition-delay: calc(var(--i) * 120ms); }
.js .about.in .body p { opacity: 1; transform: none; }

/* Effect 7 / 8: timeline drawn by scroll, cards drawn border-first */
.timeline { position: relative; display: grid; gap: 18px; padding-left: 44px; }
.tl-track { position: absolute; left: 10px; top: 0; bottom: 0; width: 1px; background: var(--grid-strong); }
.tl-line { position: absolute; left: 10px; top: 0; bottom: 0; width: 1px; background: var(--ink); transform-origin: top; transform: scaleY(var(--p, 1)); }
.job { position: relative; display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 8px 28px; padding: 22px 24px; }
.job .node { position: absolute; left: -39px; top: 28px; width: 11px; height: 11px; border: 1px solid var(--ink); background: var(--paper); border-radius: 50%; }
.job .node::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--ink); }
.js .job .node { transform: scale(0); transition: transform .5s cubic-bezier(.3,1.6,.4,1) .15s; }
.js .job.in .node { transform: none; }
.b { position: absolute; background: var(--ink); }
.b.t { top: 0; left: 0; right: 0; height: 1px; transform-origin: left; }
.b.r { top: 0; right: 0; bottom: 0; width: 1px; transform-origin: top; }
.b.bt { bottom: 0; left: 0; right: 0; height: 1px; transform-origin: right; }
.b.l { top: 0; left: 0; bottom: 0; width: 1px; transform-origin: bottom; }
.js .b.t, .js .b.bt { transform: scaleX(0); }
.js .b.r, .js .b.l { transform: scaleY(0); }
.js .b { transition: transform .32s linear; }
.js .in > .b.t { transform: none; transition-delay: 0s; }
.js .in > .b.r { transform: none; transition-delay: .32s; }
.js .in > .b.bt { transform: none; transition-delay: .64s; }
.js .in > .b.l { transform: none; transition-delay: .96s; }
.job .when { color: var(--dim); padding-top: 5px; }
.job .when span { display: block; color: var(--muted); margin-top: 6px; }
.job h3 { margin: 0; font-size: clamp(20px, 2.1vw, 24px); line-height: 1.2; font-weight: 500; font-stretch: 108%; }
.job .co { margin: 4px 0 0; color: var(--muted); }
.job ul { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; max-width: 70ch; }
.job li { position: relative; padding-left: 18px; }
.job li::before { content: ""; position: absolute; left: 0; top: .78em; width: 9px; height: 1px; background: var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.tag { font: 500 11px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 6px 8px; border: 1px solid var(--grid-strong); color: var(--muted); }
.js .job .body { opacity: 0; transform: translateY(6px); transition: opacity .7s ease .55s, transform .7s cubic-bezier(.2,.8,.2,1) .55s; }
.js .job.in .body { opacity: 1; transform: none; }
.job.current .when { color: var(--ink); }
.job.compact { padding-block: 14px; }

/* Highlights as drawing callouts */
.callouts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.callout { position: relative; padding: 26px 24px 26px 82px; min-width: 0; }
.callout .bubble { position: absolute; left: 22px; top: 24px; width: 38px; height: 38px; border: 1px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font: 500 14px/1 var(--mono); }
.callout .when { color: var(--dim); }
.callout h3 { margin: 6px 0 6px; font-size: 22px; line-height: 1.2; font-weight: 500; font-stretch: 108%; }
.callout p { margin: 0; color: var(--muted); }
.js .callout .bubble { transform: scale(0) rotate(-90deg); transition: transform .6s cubic-bezier(.3,1.5,.4,1) .2s; }
.js .callout.in .bubble { transform: none; }
.js .callout .txt { opacity: 0; transition: opacity .7s ease .7s; }
.js .callout.in .txt { opacity: 1; }

/* Effect 10: skills with measured underlines */
.skills { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px 28px; }
.skill-group h3 { margin: 0 0 14px; color: var(--dim); }
.skill-group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.skill-group li { position: relative; padding-bottom: 9px; font-size: 16px; line-height: 1.3; }
.skill-group li::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; border-left: 1px solid var(--ink); border-right: 1px solid var(--ink); background: linear-gradient(var(--ink), var(--ink)) center / 100% 1px no-repeat; transform-origin: left; }
.js .skill-group li::after { transform: scaleX(0); transition: transform .8s cubic-bezier(.6,.05,.25,1); transition-delay: calc(var(--i) * 90ms); }
.js .skill-group.in li::after { transform: none; }

.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(32px, 6vw, 80px); }
.rows { display: grid; border-top: 1px solid var(--ink); }
.row { display: flex; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--grid-strong); font-size: 18px; }
.row .mono { color: var(--muted); align-self: center; }

/* ---------- Contact + title block ---------- */
.contact { padding-bottom: 120px; }
.contact .mail { display: inline-block; font-size: clamp(26px, 5.4vw, 64px); line-height: 1.1; font-weight: 400; font-stretch: 110%; letter-spacing: -.02em; text-decoration: none; word-break: break-word; border-bottom: 1px solid var(--ink); }
.contact .mail:hover { color: var(--dim); border-color: var(--dim); }
.contact .cta { margin-top: 28px; }
.titleblock { margin-top: clamp(48px, 7vw, 88px); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--ink); background: var(--paper); }
.titleblock div { padding: 12px 14px; border-right: 1px solid var(--ink); display: grid; gap: 4px; min-width: 0; }
.titleblock div:last-child { border-right: 0; }
.titleblock small { font: 500 10px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.titleblock b { font-weight: 500; font-size: 15px; overflow-wrap: anywhere; }
.stamp { display: inline-flex; align-items: center; gap: 10px; margin-top: 18px; padding: 8px 12px; border: 1px solid var(--dim); color: var(--dim); }
.js .stamp { opacity: 0; transform: scale(1.15) rotate(-3deg); transition: opacity .5s ease .3s, transform .6s cubic-bezier(.3,1.5,.4,1) .3s; }
.complete .stamp { opacity: 1; transform: rotate(-3deg); }

/* Effect 11: crosshair cursor aligned to the grid */
.xh { position: fixed; pointer-events: none; z-index: 50; opacity: 0; transition: opacity .3s ease; }
.xh.on { opacity: 1; }
.xh-v { top: 0; bottom: 0; width: 1px; background: rgba(40, 72, 200, .22); left: 0; }
.xh-h { left: 0; right: 0; height: 1px; background: rgba(40, 72, 200, .22); top: 0; }
.xh-r { font: 500 10px/1 var(--mono); color: var(--dim); letter-spacing: .06em; padding: 4px 6px; background: var(--paper); border: 1px solid rgba(40,72,200,.3); top: 0; left: 0; }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .hero-inner { grid-template-columns: minmax(0, 1fr); align-items: start; }
  .photo { max-width: 460px; width: calc(100% - 34px); }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fact:nth-child(2) { border-right: 0; }
  .fact:nth-child(3) { padding-left: 0; }
  .fact:nth-child(n+3) { border-top: 1px solid var(--grid-strong); }
  .about, .duo, .callouts { grid-template-columns: minmax(0, 1fr); }
  .skills { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .titleblock { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .titleblock div:nth-child(2) { border-right: 0; }
  .titleblock div:nth-child(n+3) { border-top: 1px solid var(--ink); }
}
@media (max-width: 560px) {
  .timeline { padding-left: 26px; }
  .tl-track, .tl-line { left: 4px; }
  .job { grid-template-columns: minmax(0, 1fr); padding: 18px 16px; }
  .job .node { left: -27px; top: 24px; }
  .callout { padding: 22px 16px 22px 70px; }
  .callout .bubble { left: 16px; }
  .skills { grid-template-columns: minmax(0, 1fr); }
  .fact { padding-right: 12px; }
  .fact + .fact { padding-left: 12px; }
  .fact:nth-child(3) { padding-left: 0; }
  .corner { display: none; }
}
@media print { .paper, .xh { display: none; } }
</style>
</head>
<body>
<div class="paper" aria-hidden="true"></div>

<header class="hero" id="top">
  <svg class="hero-grid" aria-hidden="true"></svg>
  <span class="corner tl" aria-hidden="true"></span><span class="corner tr" aria-hidden="true"></span>
  <span class="corner bl" aria-hidden="true"></span><span class="corner br" aria-hidden="true"></span>
  <div class="wrap hero-inner">
    <div class="hero-text">
      <p class="mono sheet-label fade-late" style="--d:.5s">Sheet 01 · Curriculum vitae</p>
      <h1 class="name"><svg class="name-svg" aria-hidden="true"></svg><span class="sr" id="name-text"></span></h1>
      <p class="headline fade-late" id="headline" style="--d:2.5s"></p>
      <p class="mono now fade-late" id="now" style="--d:2.75s"></p>
      <div class="cta fade-late" id="cta" style="--d:3s"></div>
    </div>
    <figure class="photo">
      <div class="photo-frame">
        <img id="photo" alt="Portrait of Miran Demirovski" width="959" height="960">
        <span class="cover" aria-hidden="true"></span>
        <span class="scan" aria-hidden="true"></span>
      </div>
      <span class="vdim" aria-hidden="true"></span>
      <figcaption class="mono fade-late" style="--d:3.3s"><span>Fig. 1 — Portrait</span><span id="place"></span></figcaption>
    </figure>
  </div>
</header>

<main>
  <section class="wrap" aria-labelledby="h-fig">
    <div class="dim mono"><span class="tick"></span><span>02 — Figures</span><span class="line"></span></div>
    <h2 id="h-fig" data-type>Key figures</h2>
    <div class="facts" id="facts"></div>
  </section>

  <section class="wrap" aria-labelledby="h-about">
    <div class="dim mono"><span class="tick"></span><span>03 — Profile</span><span class="line"></span></div>
    <h2 id="h-about" data-type>Profile</h2>
    <div class="about" id="about"></div>
  </section>

  <section class="wrap" aria-labelledby="h-exp">
    <div class="dim mono"><span class="tick"></span><span>04 — Experience</span><span class="line"></span></div>
    <h2 id="h-exp" data-type>Experience</h2>
    <div class="timeline" id="timeline"><span class="tl-track"></span><span class="tl-line"></span></div>
  </section>

  <section class="wrap" aria-labelledby="h-hi">
    <div class="dim mono"><span class="tick"></span><span>05 — Highlights</span><span class="line"></span></div>
    <h2 id="h-hi" data-type>Highlights</h2>
    <div class="callouts" id="highlights"></div>
  </section>

  <section class="wrap" aria-labelledby="h-skills">
    <div class="dim mono"><span class="tick"></span><span>06 — Skills</span><span class="line"></span></div>
    <h2 id="h-skills" data-type>Skills</h2>
    <div class="skills" id="skills"></div>
  </section>

  <section class="wrap" aria-labelledby="h-lang">
    <div class="dim mono"><span class="tick"></span><span>07 — Languages & education</span><span class="line"></span></div>
    <div class="duo">
      <div><h2 id="h-lang" data-type>Languages</h2><div class="rows" id="langs"></div></div>
      <div><h2 data-type>Education</h2><div class="rows" id="edu"></div></div>
    </div>
  </section>

  <section class="wrap contact" aria-labelledby="h-contact" id="contact">
    <div class="dim mono"><span class="tick"></span><span>08 — Contact</span><span class="line"></span></div>
    <h2 id="h-contact" data-type>Let's talk</h2>
    <a class="mail" id="mail"></a>
    <div class="cta" id="cta2"></div>
    <div class="titleblock" id="titleblock"></div>
    <div class="stamp mono">✓ Drawing complete</div>
  </section>
</main>

<div class="xh xh-v" aria-hidden="true"></div>
<div class="xh xh-h" aria-hidden="true"></div>
<div class="xh xh-r" aria-hidden="true"></div>

<script src="../assets/cv-data.js"></script>
<script src="../assets/core.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CV, K = window.Core, t = K.t, $ = K.$, $$ = K.$$;
  var root = document.documentElement;

  /* ---------- Content ---------- */
  $("#name-text").textContent = C.first + " " + C.last;
  $("#headline").innerHTML = t(C.headline);
  $("#now").innerHTML = "<span>Now — <b>" + t(C.now.title) + ", " + t(C.now.company) + "</b></span><span>" + t(C.location) + "</span>";
  $("#place").textContent = C.location;
  var photo = $("#photo"); photo.src = C.photo.bw;

  function ctas(primary) {
    return '<a class="btn' + (primary ? " solid" : "") + '" href="' + C.pdf + '">Download PDF ↓</a>' +
      '<a class="btn" href="mailto:' + C.email + '">Email</a>' +
      '<a class="btn" href="' + C.linkedin + '" target="_blank" rel="noopener">LinkedIn ↗</a>';
  }
  $("#cta").innerHTML = ctas(true);
  $("#cta2").innerHTML = ctas(true);

  $("#facts").innerHTML = C.facts.map(function (f) {
    return '<div class="fact"><div class="num" data-to="' + f.value + '" data-dec="' + f.decimals + '" data-suf="' + f.suffix + '">0</div>' +
      '<div class="ruler" aria-hidden="true"></div><div class="mono unit">' + f.unit + '</div><div class="lbl">' + t(f.label) + "</div></div>";
  }).join("");

  $("#about").innerHTML = '<p class="lead">' + t(C.tagline) + '</p><div class="body">' +
    C.about.map(function (p, i) { return '<p style="--i:' + i + '">' + t(p) + "</p>"; }).join("") + "</div>";

  var tl = $("#timeline"), seen = {};
  C.jobs.forEach(function (j, i) {
    var rich = j.points.length > 0;
    var tenure = C.tenure[j.company] && !seen[j.company] ? " · " + C.tenure[j.company] + " in total" : "";
    seen[j.company] = true;
    var a = document.createElement("article");
    a.className = "job" + (i === 0 ? " current" : "") + (rich || j.tags.length ? "" : " compact");
    a.innerHTML = '<span class="node" aria-hidden="true"></span>' +
      '<span class="b t"></span><span class="b r"></span><span class="b bt"></span><span class="b l"></span>' +
      '<div class="mono when">' + t(j.dates) + (j.place ? "<span>" + t(j.place) + "</span>" : "") + "</div>" +
      '<div class="body"><h3>' + t(j.title) + '</h3><p class="co">' + t(j.company) + tenure + "</p>" +
      (rich ? "<ul>" + j.points.map(function (p) { return "<li>" + t(p) + "</li>"; }).join("") + "</ul>" : "") +
      (j.tags.length ? '<div class="tags">' + j.tags.map(function (g) { return '<span class="tag">' + t(g) + "</span>"; }).join("") + "</div>" : "") +
      "</div>";
    tl.appendChild(a);
  });

  $("#highlights").innerHTML = C.highlights.map(function (h, i) {
    return '<div class="callout"><span class="b t"></span><span class="b r"></span><span class="b bt"></span><span class="b l"></span>' +
      '<span class="bubble">' + String.fromCharCode(65 + i) + '</span><div class="txt"><div class="mono when">' + t(h.when) +
      "</div><h3>" + t(h.title) + "</h3><p>" + t(h.text) + "</p></div></div>";
  }).join("");

  $("#skills").innerHTML = C.skills.map(function (g) {
    return '<div class="skill-group"><h3 class="mono">' + t(g.group) + "</h3><ul>" +
      g.items.map(function (s, i) { return '<li style="--i:' + i + '">' + t(s) + "</li>"; }).join("") + "</ul></div>";
  }).join("");

  $("#langs").innerHTML = C.languages.map(function (l) {
    return '<div class="row"><span>' + t(l.name) + '</span><span class="mono">' + t(l.level) + "</span></div>";
  }).join("");
  var e = C.education;
  $("#edu").innerHTML = '<div class="row"><span>' + t(e.title) + '</span><span class="mono">' + t(e.year) + '</span></div>' +
    '<div class="row"><span>' + t(e.school) + '</span><span class="mono">' + t(e.place) + "</span></div>";

  var mail = $("#mail"); mail.href = "mailto:" + C.email; mail.textContent = C.email;
  var d = new Date(), rev = d.toLocaleString("en-GB", { month: "short" }) + " " + d.getFullYear();
  $("#titleblock").innerHTML =
    "<div><small>Drawn by</small><b>" + t(C.first + " " + C.last) + "</b></div>" +
    "<div><small>Location</small><b>" + t(C.location) + "</b></div>" +
    "<div><small>LinkedIn</small><b>" + t(C.linkedinLabel) + "</b></div>" +
    "<div><small>Sheet · Rev.</small><b>01 / 01 · " + rev + "</b></div>";

  /* ---------- Effect 1: hero grid draws from the centre outward ---------- */
  var hero = $(".hero"), svg = $(".hero-grid");
  function drawGrid() {
    var w = hero.clientWidth, h = hero.clientHeight, step = 120, cx = w / 2, cy = h / 2, out = "";
    var x0 = step - 0.5, y0 = step - 0.5;
    var maxd = Math.max(cx, cy);
    for (var x = x0; x < w; x += step) {
      var dx = Math.abs(x - cx) / maxd;
      out += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + h + '" style="--len:' + h + ';--d:' + (dx * 0.6).toFixed(2) + 's"/>';
    }
    for (var y = y0; y < h; y += step) {
      var dy = Math.abs(y - cy) / maxd;
      out += '<line x1="0" y1="' + y + '" x2="' + w + '" y2="' + y + '" style="--len:' + w + ';--d:' + (0.15 + dy * 0.6).toFixed(2) + 's"/>';
    }
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.innerHTML = out;
  }
  drawGrid();
  setTimeout(function () { root.classList.add("grid-on"); }, K.reduced ? 0 : 1500);
  var rw; window.addEventListener("resize", function () {
    clearTimeout(rw);
    rw = setTimeout(function () { svg.style.animation = "none"; drawGrid(); $$("line", svg).forEach(function (l) { l.style.animation = "none"; l.style.strokeDashoffset = 0; }); }, 150);
  });

  /* ---------- Effect 3: name outline drawn letter by letter, then filled ---------- */
  var ns = $(".name-svg");
  var words = [C.first, C.last], k = 0;
  ns.innerHTML = words.map(function (w, li) {
    return '<text x="0" y="' + (li * 98 + 80) + '">' + Array.from(w).map(function (c) {
      return '<tspan style="--d:' + (k++ * 0.06).toFixed(2) + 's">' + K.esc(c) + "</tspan>";
    }).join("") + "</text>";
  }).join("");
  function fitName() {
    try {
      var b = ns.getBBox();
      ns.setAttribute("viewBox", (b.x - 2) + " " + (b.y - 2) + " " + (b.width + 4) + " " + (b.height + 4));
    } catch (err) { ns.setAttribute("viewBox", "0 0 640 200"); }
  }
  fitName();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { fitName(); ns.classList.add("go"); });

  /* ---------- Effect 4: scan line travels the photo height ---------- */
  var frame = $(".photo-frame");
  frame.style.setProperty("--h", frame.clientHeight + "px");

  /* ---------- Effect 5: typed section titles ---------- */
  $$("[data-type]").forEach(function (h) {
    var full = h.textContent; h.setAttribute("aria-label", full);
    if (K.reduced) return;
    h.textContent = " ";
    K.onView(h, function () {
      var i = 0; h.textContent = "";
      var span = document.createElement("span"); span.setAttribute("aria-hidden", "true");
      var caret = document.createElement("span"); caret.className = "caret"; caret.setAttribute("aria-hidden", "true");
      h.appendChild(span); h.appendChild(caret);
      (function tick() {
        span.textContent = full.slice(0, ++i);
        if (i < full.length) setTimeout(tick, 34 + Math.random() * 30);
        else setTimeout(function () { caret.remove(); }, 2000);
      })();
    }, { threshold: 0.6 });
  });

  /* ---------- Effects 6, 8, 9, 10: reveals ---------- */
  K.reveal($$(".dim"));
  K.reveal($$(".about"));
  K.reveal($$(".job"), { threshold: 0.25 });
  K.reveal($$(".callout"), { threshold: 0.3 });
  K.reveal($$(".skill-group"), { threshold: 0.3 });
  K.onView($$(".fact"), function (f) {
    f.classList.add("in");
    var n = $(".num", f);
    K.countUp(n, +n.dataset.to, { decimals: +n.dataset.dec, suffix: n.dataset.suf, duration: 1700 });
  }, { threshold: 0.4 });

  /* ---------- Effect 7: timeline line follows the scroll ---------- */
  var line = $(".tl-line");
  K.onScroll(function () { line.style.setProperty("--p", K.reduced ? 1 : K.progress(tl, 0.75, 0.55).toFixed(4)); });

  /* ---------- Effect 12: drawing complete ---------- */
  K.onView($(".titleblock"), function () { root.classList.add("complete"); }, { threshold: 0.5 });

  /* ---------- Effect 11: crosshair cursor on desktop ---------- */
  if (K.finePointer && !K.reduced) {
    var v = $(".xh-v"), hz = $(".xh-h"), r = $(".xh-r");
    document.addEventListener("mousemove", function (ev) {
      var x = Math.round(ev.clientX / 24) * 24, y = Math.round(ev.clientY / 24) * 24;
      v.style.transform = "translateX(" + x + "px)";
      hz.style.transform = "translateY(" + y + "px)";
      r.style.transform = "translate(" + (x + 8) + "px," + (y + 8) + "px)";
      r.textContent = "X " + x + " · Y " + (y + Math.round(window.scrollY / 24) * 24);
      [v, hz, r].forEach(function (n) { n.classList.add("on"); });
    });
    document.addEventListener("mouseleave", function () { [v, hz, r].forEach(function (n) { n.classList.remove("on"); }); });
  }

  K.previewBar("blueprint");
})();
</script>
</body>
</html>
