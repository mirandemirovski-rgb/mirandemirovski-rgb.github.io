<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miran Demirovski · Darkroom</title>
<meta name="description" content="Miran Demirovski — Real-Time Analysis, Workforce Management and Team Leadership. Athens, Greece.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/core.css">
<style>
/* Layout: photographic paper. A developing portrait, frame numbers, a film strip, a contact sheet, a final print. */
:root {
  --paper: #fafaf9;
  --ink: #0a0a0a;
  --muted: #6a6a68;
  --line: rgba(10, 10, 10, .12);
  --film: #0c0c0c;
  --film-text: #e9e9e6;
  --grease: #c8321e;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Geist", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --pv-bg: #0a0a0a; --pv-fg: #fafaf9; --pv-line: rgba(255,255,255,.1);
  --gut: clamp(16px, 5vw, 72px);
  --max: 1240px;
  color-scheme: light;
}
body { background: var(--paper); color: var(--ink); font: 400 16px/1.6 var(--body); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; }
.wrap { max-width: var(--max); margin: 0 auto; padding-inline: var(--gut); }

/* Effect 2: film grain */
.grain { position: fixed; inset: 0; pointer-events: none; z-index: 60; opacity: 0; mix-blend-mode: multiply; transition: opacity 2.5s ease; }
.grain.on { opacity: .09; }

/* Effect 5: frame numbers */
.frame-no { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.frame-no::before { content: ""; width: 0; height: 0; border-left: 6px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }

/* ---------- Hero ---------- */
.hero { padding-block: clamp(28px, 6vw, 80px) clamp(48px, 7vw, 96px); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(28px, 6vw, 96px); align-items: center; }

.print { position: relative; margin: 0; background: var(--film); padding: 14px 14px 34px; min-width: 0; }
.print .edge { position: absolute; left: 14px; right: 14px; bottom: 10px; display: flex; justify-content: space-between; color: rgba(233,233,230,.6); font-size: 10px; }
.print .img { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--paper); }
.print img { width: 100%; height: 100%; object-fit: cover; object-position: 56% 40%; filter: contrast(1.08); }
/* Effect 3: develops, shadows first */
.js .print img { opacity: 0; animation: develop 3.6s cubic-bezier(.3,.1,.3,1) .5s forwards; }
@keyframes develop {
  0% { opacity: 0; filter: brightness(2.6) contrast(2.6); }
  12% { opacity: 1; filter: brightness(2.6) contrast(2.6); }
  50% { filter: brightness(1.55) contrast(1.5); }
  100% { opacity: 1; filter: brightness(1) contrast(1.08); }
}
/* Effect 7: one slow light sweep over the print */
.print .sweep { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.32) 50%, transparent 65%); transform: translateX(-120%); }
.js .print .sweep { animation: sweep 2.6s cubic-bezier(.4,.1,.3,1) 3.4s forwards; }
@keyframes sweep { to { transform: translateX(120%); } }

.hero-text { min-width: 0; display: grid; gap: 26px; }
/* Effect 4: name comes into focus */
.name { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(54px, 9vw, 132px); line-height: .9; letter-spacing: -.02em; font-optical-sizing: auto; }
.name span { display: block; }
.name .it { font-style: italic; }
.js .name span { opacity: 0; filter: blur(16px); letter-spacing: .12em; animation: focus 2s cubic-bezier(.2,.7,.2,1) forwards; }
.js .name span:nth-child(1) { animation-delay: 1.4s; }
.js .name span:nth-child(2) { animation-delay: 1.7s; }
@keyframes focus { to { opacity: 1; filter: blur(0); letter-spacing: -.02em; } }
.headline { margin: 0; font-size: clamp(17px, 1.6vw, 20px); line-height: 1.5; max-width: 36ch; }
.now { color: var(--muted); display: grid; gap: 6px; }
.now b { color: var(--ink); font-weight: 500; }
.js .late { opacity: 0; transform: translateY(10px); animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--d); }
@keyframes rise { to { opacity: 1; transform: none; } }

.cta { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.btn { font: 500 14px/1 var(--body); text-decoration: none; padding: 15px 20px; background: var(--ink); color: var(--paper); border: 1px solid var(--ink); transition: background .3s ease, color .3s ease; }
.btn:hover { background: transparent; color: var(--ink); }
.link { font: 500 14px/1 var(--body); text-decoration: none; padding-block: 6px; background: linear-gradient(currentColor, currentColor) left bottom / 100% 1px no-repeat; transition: background-size .35s ease; }
.link:hover { background-size: 0 1px; background-position: right bottom; }

/* ---------- Sections ---------- */
section { padding-block: clamp(64px, 9vw, 120px) 0; }
.sec-head { display: grid; gap: 14px; margin-bottom: clamp(28px, 4vw, 52px); }
h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(38px, 5.4vw, 72px); line-height: 1; letter-spacing: -.015em; }
h2 em { font-style: italic; }
/* Effect 6: sections settle like prints hung to dry */
.js .hang { opacity: 0; transform: translateY(-22px) rotate(-.7deg); transform-origin: top left; transition: opacity 1s ease, transform 1.4s cubic-bezier(.25,1.3,.4,1); }
.js .hang.in { opacity: 1; transform: none; }

/* Effect 11: exposure counter digits */
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--ink); }
.fact { padding: 24px 22px 0 0; display: grid; gap: 10px; align-content: start; min-width: 0; }
.fact + .fact { padding-left: 22px; border-left: 1px solid var(--line); }
.counter { font-family: var(--display); font-size: clamp(56px, 7vw, 96px); line-height: 1; display: flex; font-variant-numeric: lining-nums tabular-nums; }
.dg { display: inline-block; height: 1em; overflow: hidden; }
.dg .col { display: block; transition: transform 1.8s cubic-bezier(.2,.8,.15,1); transition-delay: var(--dl); }
.dg .col span { display: block; height: 1em; }
.fact .exp { color: var(--muted); }
.fact .lbl { font-size: 15px; line-height: 1.45; max-width: 24ch; }

.about { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 80px); align-items: start; }
.about .lead { margin: 0; font-family: var(--display); font-style: italic; font-size: clamp(28px, 3.4vw, 46px); line-height: 1.12; letter-spacing: -.01em; }
.about .body { display: grid; gap: 14px; font-size: 17px; max-width: 58ch; }
.about .body p { margin: 0; }

/* Effect 8 / 9: the career film strip */
.strip-outer { position: relative; }
.strip-sticky { padding-block: 8px; }
.strip { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; background: var(--film); color: var(--film-text); padding: 26px 34px; position: relative; }
.strip::before, .strip::after { content: ""; position: absolute; top: 0; bottom: 0; width: 14px; background: radial-gradient(circle at center, var(--paper) 0 3.4px, transparent 3.9px) center top / 14px 22px repeat-y; }
.strip::before { left: 10px; }
.strip::after { right: 10px; }
.fr { position: relative; padding: 22px 22px 24px; border: 1px solid rgba(233,233,230,.16); margin-block: 8px; display: grid; gap: 10px; align-content: start; transition: filter .45s ease, opacity .45s ease; min-width: 0; }
.fr .code { display: flex; justify-content: space-between; gap: 12px; color: rgba(233,233,230,.55); }
.fr h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(24px, 2.4vw, 30px); line-height: 1.1; }
.fr .co { margin: 0; color: rgba(233,233,230,.7); font-size: 15px; }
.fr ul { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 14.5px; line-height: 1.5; color: rgba(233,233,230,.86); }
.fr li { padding-left: 16px; position: relative; }
.fr li::before { content: ""; position: absolute; left: 0; top: .72em; width: 8px; height: 1px; background: currentColor; }
.fr .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.fr .tag { font: 500 10.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 6px 7px; border: 1px solid rgba(233,233,230,.22); color: rgba(233,233,230,.72); }
.fr.now-frame { border-color: rgba(233,233,230,.6); }
.strip.focusing .fr { filter: blur(1.6px); opacity: .5; }
.strip.focusing .fr.focus { filter: none; opacity: 1; }
.js .fr { opacity: 0; transform: translateY(14px); }
.js .fr.in { opacity: 1; transform: none; transition: opacity .9s ease, transform .9s cubic-bezier(.2,.8,.2,1), filter .45s ease; }
.strip-hint { margin-top: 14px; color: var(--muted); display: none; }

@media (min-width: 900px) {
  .strip-outer.horizontal .strip-sticky { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .strip-outer.horizontal .strip { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 390px; gap: 18px; padding: 40px 30px; width: max-content; will-change: transform; }
  .strip-outer.horizontal .strip::before, .strip-outer.horizontal .strip::after { left: 0; right: 0; width: auto; height: 14px; top: auto; bottom: auto; background: radial-gradient(circle at center, var(--paper) 0 3.6px, transparent 4.1px) left center / 22px 14px repeat-x; }
  .strip-outer.horizontal .strip::before { top: 12px; }
  .strip-outer.horizontal .strip::after { bottom: 12px; }
  .strip-outer.horizontal .fr { margin: 0; }
  .strip-outer.horizontal .strip-hint { display: flex; }
}

/* Effect 10: contact sheet + grease pencil */
.sheet { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; background: var(--film); padding: 14px; }
.cell { position: relative; background: var(--paper); padding: 20px 18px 22px; display: grid; gap: 8px; align-content: start; min-height: 220px; min-width: 0; }
.cell .code { color: var(--muted); display: flex; justify-content: space-between; }
.cell h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.1; }
.cell p { margin: 0; font-size: 14.5px; color: var(--muted); line-height: 1.5; }
.cell ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 15px; }
.cell li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.cell li span:last-child { color: var(--muted); font-size: 13px; }
.grease { position: absolute; inset: -12px -10px -10px -12px; width: calc(100% + 22px); height: calc(100% + 22px); pointer-events: none; overflow: visible; }
.grease path { fill: none; stroke: var(--grease); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; opacity: .9; }
.js .grease path { stroke-dasharray: 1; stroke-dashoffset: 1; }
.js .sheet.in .grease path { transition: stroke-dashoffset 1.3s cubic-bezier(.5,.1,.3,1) .9s; stroke-dashoffset: 0; }
.grease-note { position: absolute; right: 14px; bottom: -34px; color: var(--grease); font: italic 400 18px/1 var(--display); transform: rotate(-4deg); }
.js .grease-note { opacity: 0; transition: opacity .6s ease 2.1s; }
.js .sheet.in .grease-note { opacity: 1; }
.js .cell { opacity: 0; transition: opacity 1.2s ease; transition-delay: calc(var(--i) * 180ms + .1s); filter: brightness(1.4); }
.js .sheet.in .cell { opacity: 1; filter: none; transition: opacity 1.2s ease, filter 2s ease; transition-delay: calc(var(--i) * 180ms + .1s); }

.skills { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 36px 28px; }
.skill-group h3 { margin: 0 0 14px; color: var(--muted); }
.skill-group ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.skill-group li { font-family: var(--display); font-size: 21px; line-height: 1.35; }
.js .skill-group li { opacity: 0; filter: blur(6px); transition: opacity .8s ease, filter 1s ease; transition-delay: calc(var(--i) * 80ms); }
.js .skill-group.in li { opacity: 1; filter: none; }

/* Effect 12: the final print */
.final { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: clamp(32px, 6vw, 96px); align-items: center; padding-bottom: 130px; }
.final .mail { font-family: var(--display); font-size: clamp(25px, 3.7vw, 52px); line-height: 1.05; text-decoration: none; overflow-wrap: anywhere; display: inline-block; margin: 6px 0 26px; letter-spacing: -.01em; }
.final .mail:hover { font-style: italic; }
.final .meta { display: grid; gap: 6px; color: var(--muted); margin-bottom: 28px; }
.final .meta a { text-decoration: none; overflow-wrap: anywhere; }
.final .meta a:hover { color: var(--ink); }
.mini { margin: 0; background: #fff; padding: 12px; box-shadow: 0 1px 0 var(--line), 0 30px 60px -30px rgba(0,0,0,.35); transform: rotate(1.5deg); }
.mini img { width: 100%; height: auto; aspect-ratio: 210 / 297; object-fit: cover; object-position: top; outline: 1px solid var(--line); }
.mini figcaption { margin-top: 10px; color: var(--muted); display: flex; justify-content: space-between; }
.js .mini img { filter: brightness(2.2) contrast(.4); opacity: .2; transition: filter 3s cubic-bezier(.3,.1,.3,1), opacity 1.2s ease; }
.js .mini.in img { filter: none; opacity: 1; }

@media (max-width: 900px) {
  .hero-grid, .about, .final { grid-template-columns: minmax(0, 1fr); }
  .print { max-width: 520px; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fact:nth-child(3) { padding-left: 0; border-left: 0; }
  .fact:nth-child(n+3) { padding-top: 28px; }
  .sheet { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .skills { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mini { max-width: 300px; }
}
@media (max-width: 560px) {
  .sheet { grid-template-columns: minmax(0, 1fr); }
  .fact { padding-right: 12px; }
  .fact + .fact { padding-left: 12px; }
  .fact:nth-child(3) { padding-left: 0; }
  .strip { padding: 18px 30px; }
  .skills { grid-template-columns: minmax(0, 1fr); }
}
@media print { .grain { display: none; } }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="hero wrap" id="top">
  <div class="hero-grid">
    <figure class="print">
      <div class="img"><img id="photo" alt="Portrait of Miran Demirovski" width="959" height="960"><span class="sweep" aria-hidden="true"></span></div>
      <figcaption class="edge mono" aria-hidden="true"><span>▸ 00A</span><span>Athens</span><span>B&amp;W 400</span></figcaption>
    </figure>
    <div class="hero-text">
      <p class="mono frame-no late" style="--d:1s">Frame 00A · Curriculum vitae</p>
      <h1 class="name" id="name"></h1>
      <p class="headline late" id="headline" style="--d:2.5s"></p>
      <p class="mono now late" id="now" style="--d:2.75s"></p>
      <div class="cta late" id="cta" style="--d:3s"></div>
    </div>
  </div>
</header>

<main>
  <section class="wrap" aria-labelledby="h1">
    <div class="sec-head hang"><p class="mono frame-no">Frame 01A</p><h2 id="h1">In <em>numbers</em></h2></div>
    <div class="facts" id="facts"></div>
  </section>

  <section class="wrap" aria-labelledby="h2">
    <div class="sec-head hang"><p class="mono frame-no">Frame 02A</p><h2 id="h2">Profile</h2></div>
    <div class="about hang" id="about"></div>
  </section>

  <section aria-labelledby="h3">
    <div class="wrap sec-head hang"><p class="mono frame-no">Frame 03A</p><h2 id="h3">Career, <em>frame by frame</em></h2></div>
    <div class="strip-outer" id="strip-outer">
      <div class="strip-sticky">
        <div class="strip" id="strip"></div>
        <p class="wrap mono strip-hint">Scroll to advance the film · hover a frame to focus</p>
      </div>
    </div>
  </section>

  <section class="wrap" aria-labelledby="h4">
    <div class="sec-head hang"><p class="mono frame-no">Frame 04A</p><h2 id="h4">Contact <em>sheet</em></h2></div>
    <div class="sheet" id="sheet"></div>
  </section>

  <section class="wrap" aria-labelledby="h5">
    <div class="sec-head hang"><p class="mono frame-no">Frame 05A</p><h2 id="h5">Skills</h2></div>
    <div class="skills" id="skills"></div>
  </section>

  <section class="wrap final" aria-labelledby="h6">
    <div>
      <div class="sec-head hang"><p class="mono frame-no">Frame 06A · Final print</p><h2 id="h6">Let's <em>talk</em></h2></div>
      <a class="mail" id="mail"></a>
      <div class="meta mono" id="meta"></div>
      <div class="cta" id="cta2"></div>
    </div>
    <figure class="mini" id="mini">
      <img id="mini-img" alt="Preview of the one-page PDF CV" width="840" height="1188">
      <figcaption class="mono"><span>One-page PDF</span><span>A4</span></figcaption>
    </figure>
  </section>
</main>

<script src="../assets/cv-data.js"></script>
<script src="../assets/core.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CV, K = window.Core, t = K.t, $ = K.$, $$ = K.$$;

  /* ---------- Content ---------- */
  $("#photo").src = C.photo.bw;
  $("#name").innerHTML = '<span>' + K.esc(C.first) + '</span><span class="it">' + K.esc(C.last) + "</span>";
  $("#headline").innerHTML = t(C.headline);
  $("#now").innerHTML = "<span>Now — <b>" + t(C.now.title) + ", " + t(C.now.company) + "</b></span><span>" + t(C.location) + "</span>";
  function ctas() {
    return '<a class="btn" href="' + C.pdf + '">Download PDF</a>' +
      '<a class="link" href="mailto:' + C.email + '">Email</a>' +
      '<a class="link" href="' + C.linkedin + '" target="_blank" rel="noopener">LinkedIn ↗</a>';
  }
  $("#cta").innerHTML = ctas();
  $("#cta2").innerHTML = ctas();

  // Effect 11: rolling digits
  function counterHTML(f) {
    var txt = K.fmtNum(f.value, f.decimals) + f.suffix, out = "", n = 0;
    Array.from(txt).forEach(function (ch) {
      if (/\d/.test(ch)) {
        var col = ""; for (var d = 0; d <= 9; d++) col += "<span>" + d + "</span>";
        out += '<span class="dg" aria-hidden="true"><span class="col" data-d="' + ch + '" style="--dl:' + (n++ * 0.12) + 's">' + col + "</span></span>";
      } else out += '<span aria-hidden="true">' + ch + "</span>";
    });
    return '<span class="sr">' + txt + "</span>" + out;
  }
  $("#facts").innerHTML = C.facts.map(function (f, i) {
    return '<div class="fact hang" style="transition-delay:' + i * 0.12 + 's"><div class="counter">' + counterHTML(f) + '</div><div class="mono exp">Exp. ' + (i + 1) + " · " + f.unit + '</div><div class="lbl">' + t(f.label) + "</div></div>";
  }).join("");

  $("#about").innerHTML = '<p class="lead">' + t(C.tagline) + '</p><div class="body">' + C.about.map(function (p) { return "<p>" + t(p) + "</p>"; }).join("") + "</div>";

  var seen = {};
  $("#strip").innerHTML = C.jobs.map(function (j, i) {
    var tenure = C.tenure[j.company] && !seen[j.company] ? " · " + C.tenure[j.company] + " in total" : "";
    seen[j.company] = true;
    var code = String(C.jobs.length - i).padStart(2, "0") + "A";
    return '<article class="fr' + (i === 0 ? " now-frame" : "") + '"><div class="code mono"><span>▸ ' + code + "</span><span>" + t(j.dates) + "</span></div>" +
      "<h3>" + t(j.title) + '</h3><p class="co">' + t(j.company) + tenure + (j.place ? " · " + t(j.place) : "") + "</p>" +
      (j.points.length ? "<ul>" + j.points.map(function (p) { return "<li>" + t(p) + "</li>"; }).join("") + "</ul>" : "") +
      (j.tags.length ? '<div class="tags">' + j.tags.map(function (g) { return '<span class="tag">' + t(g) + "</span>"; }).join("") + "</div>" : "") +
      "</article>";
  }).join("");

  var e = C.education;
  var cells = C.highlights.map(function (h) {
    return { code: h.when, title: h.title, body: "<p>" + t(h.text) + "</p>" };
  });
  cells.push({ code: "Languages", title: "Three languages", body: "<ul>" + C.languages.map(function (l) { return "<li><span>" + t(l.name) + "</span><span>" + t(l.level) + "</span></li>"; }).join("") + "</ul>" });
  cells.push({ code: "Education", title: t(e.title), body: "<p>" + t(e.school) + ", " + t(e.place) + "<br>" + t(e.year) + "</p>" });
  $("#sheet").innerHTML = cells.map(function (c, i) {
    var mark = i === 0 ? '<svg class="grease" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M52 4 C 80 3, 97 12, 97 48 C 97 86, 78 97, 48 96 C 16 95, 3 84, 4 50 C 5 16, 22 5, 58 7"/></svg><span class="grease-note" aria-hidden="true">keep</span>' : "";
    return '<div class="cell" style="--i:' + i + '">' + mark + '<div class="code mono"><span>▸ ' + String(i + 1).padStart(2, "0") + "</span><span>" + t(c.code) + "</span></div><h3>" + c.title + "</h3>" + c.body + "</div>";
  }).join("");

  $("#skills").innerHTML = C.skills.map(function (g) {
    return '<div class="skill-group"><h3 class="mono">' + t(g.group) + "</h3><ul>" + g.items.map(function (s, i) { return '<li style="--i:' + i + '">' + t(s) + "</li>"; }).join("") + "</ul></div>";
  }).join("");

  var mail = $("#mail"); mail.href = "mailto:" + C.email; mail.textContent = C.email;
  $("#meta").innerHTML = "<span>" + t(C.location) + '</span><a href="' + C.linkedin + '" target="_blank" rel="noopener">' + t(C.linkedinLabel) + "</a>";
  $("#mini-img").src = "../assets/cv-print.png";

  /* ---------- Effect 1 + 2: blank paper, then grain ---------- */
  (function grain() {
    var c = document.createElement("canvas"); c.width = c.height = 160;
    var x = c.getContext("2d"), img = x.createImageData(160, 160);
    for (var i = 0; i < img.data.length; i += 4) {
      var v = 120 + Math.random() * 135; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    var g = $(".grain"); g.style.backgroundImage = "url(" + c.toDataURL() + ")";
    setTimeout(function () { g.classList.add("on"); }, K.reduced ? 0 : 600);
  })();

  /* ---------- Reveals ---------- */
  K.reveal($$(".hang"), { threshold: 0.2 });
  K.onView($$(".fact"), function (f) {
    $$(".col", f).forEach(function (col) { col.style.transform = "translateY(" + (-col.dataset.d) + "em)"; });
  }, { threshold: 0.5 });
  K.reveal($$(".fr"), { threshold: 0.1, rootMargin: "0px 0px 0px 0px" });
  K.reveal($("#sheet"), { threshold: 0.3 });
  K.reveal($$(".skill-group"), { threshold: 0.3 });
  K.reveal($("#mini"), { threshold: 0.4 });

  /* ---------- Effect 8: horizontal film strip on desktop ---------- */
  var outer = $("#strip-outer"), strip = $("#strip"), sticky = $(".strip-sticky");
  var wide = window.matchMedia("(min-width: 900px)");
  function layout() {
    if (wide.matches && !K.reduced) {
      outer.classList.add("horizontal");
      var travel = Math.max(0, strip.scrollWidth - window.innerWidth + 60);
      outer.style.height = (window.innerHeight + travel) + "px";
      outer.dataset.travel = travel;
      $$(".fr").forEach(function (f) { f.classList.add("in"); });
    } else {
      outer.classList.remove("horizontal");
      outer.style.height = "";
      strip.style.transform = "";
    }
  }
  layout();
  window.addEventListener("resize", layout);
  if (document.fonts) document.fonts.ready.then(layout);
  K.onScroll(function () {
    if (!outer.classList.contains("horizontal")) return;
    var r = outer.getBoundingClientRect();
    var p = Math.min(1, Math.max(0, -r.top / (r.height - window.innerHeight || 1)));
    strip.style.transform = "translateX(" + (60 - p * (+outer.dataset.travel + 0)) + "px)";
  });

  /* ---------- Effect 9: focus pull on hover ---------- */
  $$(".fr").forEach(function (f) {
    f.addEventListener("mouseenter", function () { strip.classList.add("focusing"); f.classList.add("focus"); });
    f.addEventListener("mouseleave", function () { strip.classList.remove("focusing"); f.classList.remove("focus"); });
  });

  K.previewBar("darkroom");
})();
</script>
</body>
</html>
