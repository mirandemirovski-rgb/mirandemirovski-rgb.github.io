<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miran Demirovski · Swiss Grid</title>
<meta name="description" content="Miran Demirovski — Real-Time Analysis, Workforce Management and Team Leadership. Athens, Greece.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap">
<link rel="stylesheet" href="../assets/core.css">
<style>
/* Layout: a 12-column Swiss grid. Fixed portrait column on the left, numbered story on the right, one red accent. */
:root {
  --paper: #ffffff;
  --ink: #0d0d0d;
  --muted: #6e6e6e;
  --rule: #0d0d0d;
  --hair: rgba(13, 13, 13, .1);
  --red: #e2231a;
  --sans: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --pv-bg: #0d0d0d; --pv-fg: #fff; --pv-line: rgba(255,255,255,.1);
  --gut: clamp(16px, 3vw, 40px);
  color-scheme: light;
}
body { background: var(--paper); color: var(--ink); font: 400 17px/1.5 var(--sans); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.lab { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }

/* Effect 1 + 12: twelve column lines */
.colgrid { position: fixed; inset: 0; z-index: 0; pointer-events: none; padding-inline: var(--gut); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gut); transition: opacity 1.4s ease; }
.colgrid i { border-left: 1px solid rgba(226, 35, 26, .13); border-right: 1px solid rgba(226, 35, 26, .13); transform-origin: top; }
.js .colgrid i { transform: scaleY(0); animation: drop 1.2s cubic-bezier(.6,.05,.25,1) forwards; animation-delay: calc(var(--i) * 60ms); }
@keyframes drop { to { transform: none; } }
.colgrid.quiet { opacity: .35; }
.colgrid.gone { opacity: 0; }

.layout { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gut); padding-inline: var(--gut); }
.left { grid-column: 1 / span 5; position: sticky; top: 0; height: 100vh; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 24px; padding-block: var(--gut); }
.right { grid-column: 7 / span 6; padding-block: var(--gut) 160px; min-width: 0; }

/* Effect 3 + 7: blinds, parallax, then color at the end */
.photo { position: relative; overflow: hidden; min-height: 0; background: var(--paper); }
.photo img { position: absolute; left: 0; right: 0; top: -6%; width: 100%; height: 112%; object-fit: cover; object-position: 56% 38%; filter: grayscale(var(--gs, 1)) contrast(1.1); transform: translateY(var(--py, 0px)); will-change: transform; }
.slats { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); }
.slats i { background: var(--paper); transform-origin: left; }
.js .slats i { animation: blind 1.1s cubic-bezier(.7,0,.2,1) forwards; animation-delay: calc(.9s + var(--i) * 85ms); }
html:not(.js) .slats { display: none; }
@keyframes blind { to { transform: scaleX(0); } }
.photo .cap { position: absolute; left: 12px; bottom: 10px; color: #fff; mix-blend-mode: difference; z-index: 2; }

/* Effect 2: name rises letter by letter */
.name { margin: 0; font-weight: 700; font-stretch: 78%; font-size: clamp(52px, 6.6vw, 112px); line-height: .86; letter-spacing: -.035em; }
.name .ln { display: block; overflow: hidden; padding-bottom: .04em; }
.name .ch { display: inline-block; }
.js .name .ch { transform: translateY(105%); animation: rise .9s cubic-bezier(.2,.9,.2,1) forwards; animation-delay: calc(.35s + var(--i) * 40ms); }
@keyframes rise { to { transform: none; } }
.id-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px var(--gut); align-items: end; }
.id-meta p { margin: 0; }
.headline { font-size: clamp(16px, 1.3vw, 19px); line-height: 1.35; font-weight: 500; }
.now { color: var(--muted); font-size: 15px; }
.now b { color: var(--ink); font-weight: 600; }
.cta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: 600 14px/1 var(--sans); text-decoration: none; padding: 13px 16px; border: 1.5px solid var(--ink); display: inline-flex; gap: 10px; align-items: center; transition: background .2s ease, color .2s ease; }
.btn.solid, .btn:hover { background: var(--ink); color: var(--paper); }
.btn.solid:hover { background: var(--red); border-color: var(--red); }
.js .fade-in { opacity: 0; animation: fin .9s ease forwards; animation-delay: var(--d); }
@keyframes fin { to { opacity: 1; } }

/* ---------- Right column ---------- */
section { padding-top: clamp(56px, 7vw, 96px); }
section:first-child { padding-top: clamp(8px, 5vh, 56px); }
.sh { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: end; gap: var(--gut); }
/* Effect 4: section numbers roll */
.no { font-weight: 700; font-stretch: 78%; font-size: 64px; line-height: 1; color: var(--red); display: inline-flex; height: 1em; overflow: hidden; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.no .col { display: block; transition: transform 1.4s cubic-bezier(.2,.9,.15,1); transition-delay: var(--dl); }
.no .col span { display: block; height: 1em; }
h2 { margin: 0; font-size: clamp(26px, 2.6vw, 38px); font-weight: 600; line-height: 1.05; letter-spacing: -.02em; padding-bottom: 6px; }
/* Effect 5: rules extend left to right */
.rule { height: 2px; background: var(--rule); margin: 16px 0 28px; transform-origin: left; }
.js .rule { transform: scaleX(0); transition: transform 1.2s cubic-bezier(.7,0,.2,1); }
.js .in .rule, .js .rule.in { transform: none; }
/* Effect 6: blocks snap into columns */
.js .snap { opacity: 0; transform: translateX(28px); transition: opacity .7s ease, transform .9s cubic-bezier(.25,1.35,.4,1); transition-delay: var(--sd, .15s); }
.js .snap.in, .js .in > .snap { opacity: 1; transform: none; }

.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--gut); }
.fact { border-top: 1px solid var(--hair); padding: 18px 0 22px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-items: baseline; }
.fact .v { font-weight: 700; font-stretch: 78%; font-size: clamp(56px, 6vw, 88px); line-height: .9; letter-spacing: -.04em; font-variant-numeric: tabular-nums; grid-row: span 2; }
.fact .u { color: var(--red); }
.fact .l { color: var(--muted); font-size: 15px; line-height: 1.35; }

/* Effect 9: words darken as you read */
.about .lead { margin: 0 0 18px; font-size: clamp(26px, 2.8vw, 40px); line-height: 1.12; font-weight: 600; letter-spacing: -.02em; }
.about .read { margin: 0; font-size: clamp(19px, 1.6vw, 22px); line-height: 1.45; font-weight: 500; letter-spacing: -.005em; }
.about .read .w { color: #c8c8c8; transition: color .25s ease; }
.about .read .w.lit { color: var(--ink); }

/* Effect 8 + 10: career floors, hover inverts */
.floors { display: grid; gap: 0; }
.floor { display: grid; grid-template-columns: 52px 150px minmax(0, 1fr); gap: 6px var(--gut); padding: 18px 12px; border-top: 1px solid var(--hair); transition: background .25s ease, color .25s ease; }
.floor:last-child { border-bottom: 1px solid var(--hair); }
.floor .f { font-weight: 700; font-stretch: 78%; color: var(--red); font-size: 18px; line-height: 1.3; }
.floor .d { color: var(--muted); font-size: 14px; line-height: 1.5; padding-top: 2px; }
.floor h3 { margin: 0; font-size: 21px; line-height: 1.2; font-weight: 600; letter-spacing: -.01em; }
.floor .co { margin: 2px 0 0; color: var(--muted); }
.floor ul { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: 15.5px; line-height: 1.45; }
.floor li { position: relative; padding-left: 16px; }
.floor li::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; background: var(--red); }
.floor .tags { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
.floor .tags span { font-size: 12px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; padding: 4px 7px; border: 1px solid var(--hair); }
.floor:hover { background: var(--ink); color: var(--paper); }
.floor:hover .d, .floor:hover .co { color: rgba(255,255,255,.62); }
.floor:hover .tags span { border-color: rgba(255,255,255,.25); }
.js .floor { opacity: 0; transform: translateY(34px); }
.js .floors.in .floor { opacity: 1; transform: none; transition: opacity .7s ease, transform .8s cubic-bezier(.2,.9,.2,1), background .25s ease, color .25s ease; transition-delay: calc(var(--rev) * 90ms), calc(var(--rev) * 90ms), 0s, 0s; }

.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gut); }
.card { border: 1.5px solid var(--ink); padding: 22px; transition: background .25s ease, color .25s ease; min-width: 0; }
.card .k { color: var(--red); }
.card h3 { margin: 8px 0 6px; font-size: 22px; line-height: 1.15; font-weight: 600; }
.card p { margin: 0; color: var(--muted); }
.card:hover { background: var(--ink); color: var(--paper); }
.card:hover p { color: rgba(255,255,255,.7); }

/* Effect 11: skill tags in a wave */
.skills { display: grid; gap: 22px; }
.sg { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 8px var(--gut); }
.sg .lab { padding-top: 8px; }
.tags2 { display: flex; flex-wrap: wrap; gap: 6px; }
.tags2 span { padding: 7px 11px; background: #f2f2f2; font-size: 15px; font-weight: 500; }
.js .tags2 span { opacity: 0; transform: translateY(10px) scale(.96); transition: opacity .5s ease, transform .6s cubic-bezier(.2,1.4,.4,1); transition-delay: calc(var(--i) * 45ms); }
.js .skills.in .tags2 span { opacity: 1; transform: none; }

.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gut); }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--hair); }
.kv span:last-child { color: var(--muted); }

.mail { display: inline-block; font-weight: 700; font-stretch: 78%; font-size: clamp(32px, 4.4vw, 68px); line-height: 1; letter-spacing: -.03em; text-decoration: none; overflow-wrap: anywhere; }
.mail:hover { color: var(--red); }
.cmeta { margin-top: 16px; color: var(--muted); display: grid; gap: 4px; }
.cmeta a { text-decoration: none; overflow-wrap: anywhere; }
.cmeta a:hover { color: var(--ink); }
.contact .cta { margin-top: 24px; }

@media (max-width: 960px) {
  .layout { display: block; }
  .left { position: static; height: auto; grid-template-rows: auto auto; padding-top: 16px; }
  .photo { aspect-ratio: 4 / 5; max-height: 70vh; }
  .right { padding-top: 0; }
  section:first-child { padding-top: 56px; }
  .colgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .colgrid i:nth-child(n+5) { display: none; }
}
@media (max-width: 560px) {
  .id-meta { grid-template-columns: minmax(0, 1fr); }
  .sh { grid-template-columns: 64px minmax(0, 1fr); }
  .no { font-size: 46px; }
  .facts, .cards, .duo { grid-template-columns: minmax(0, 1fr); }
  .floor { grid-template-columns: 40px minmax(0, 1fr); padding-inline: 8px; }
  .floor .d { grid-column: 2; grid-row: 1; padding-top: 0; }
  .floor .body { grid-column: 2; }
  .sg { grid-template-columns: minmax(0, 1fr); }
}
@media print { .colgrid { display: none; } .left { position: static; height: auto; } }
</style>
</head>
<body>
<div class="colgrid" id="colgrid" aria-hidden="true"></div>

<div class="layout">
  <aside class="left" id="top">
    <div class="photo" id="photo-box">
      <img id="photo" alt="Portrait of Miran Demirovski" width="959" height="960">
      <div class="slats" aria-hidden="true"></div>
      <span class="cap lab fade-in" style="--d:2s" id="cap"></span>
    </div>
    <div class="id">
      <h1 class="name" id="name"></h1>
      <div class="id-meta" style="margin-top:20px">
        <p class="headline fade-in" id="headline" style="--d:1.3s"></p>
        <p class="now fade-in" id="now" style="--d:1.5s"></p>
        <div class="cta fade-in" id="cta" style="--d:1.7s"></div>
      </div>
    </div>
  </aside>

  <main class="right">
    <section data-n="01"><div class="sh"><span class="no" aria-hidden="true"></span><h2>Key figures</h2></div><div class="rule"></div><div class="facts snap" id="facts"></div></section>
    <section data-n="02"><div class="sh"><span class="no" aria-hidden="true"></span><h2>Profile</h2></div><div class="rule"></div><div class="about snap" id="about"></div></section>
    <section data-n="03"><div class="sh"><span class="no" aria-hidden="true"></span><h2>Experience</h2></div><div class="rule"></div><div class="floors" id="floors"></div></section>
    <section data-n="04"><div class="sh"><span class="no" aria-hidden="true"></span><h2>Highlights</h2></div><div class="rule"></div><div class="cards snap" id="cards"></div></section>
    <section data-n="05"><div class="sh"><span class="no" aria-hidden="true"></span><h2>Skills</h2></div><div class="rule"></div><div class="skills" id="skills"></div></section>
    <section data-n="06"><div class="sh"><span class="no" aria-hidden="true"></span><h2>Languages &amp; education</h2></div><div class="rule"></div><div class="duo snap"><div id="langs"></div><div id="edu"></div></div></section>
    <section data-n="07" class="contact" id="contact"><div class="sh"><span class="no" aria-hidden="true"></span><h2>Contact</h2></div><div class="rule"></div><div class="snap"><a class="mail" id="mail"></a><div class="cmeta" id="cmeta"></div><div class="cta" id="cta2"></div></div></section>
  </main>
</div>

<script src="../assets/cv-data.js"></script>
<script src="../assets/core.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CV, K = window.Core, t = K.t, $ = K.$, $$ = K.$$;

  /* ---------- Content ---------- */
  $("#colgrid").innerHTML = Array.from({ length: 12 }, function (_, i) { return '<i style="--i:' + i + '"></i>'; }).join("");
  $(".slats").innerHTML = Array.from({ length: 8 }, function (_, i) { return '<i style="--i:' + i + '"></i>'; }).join("");
  $("#photo").src = C.photo.color;
  $("#cap").textContent = C.location;
  var k = 0;
  $("#name").setAttribute("aria-label", C.first + " " + C.last);
  $("#name").innerHTML = [C.first, C.last].map(function (w) {
    return '<span class="ln" aria-hidden="true">' + Array.from(w).map(function (c) { return '<span class="ch" style="--i:' + (k++) + '">' + K.esc(c) + "</span>"; }).join("") + "</span>";
  }).join("");
  $("#headline").innerHTML = t(C.headline);
  $("#now").innerHTML = "Now<br><b>" + t(C.now.title) + "</b><br>" + t(C.now.company) + ", since " + t(C.now.since);
  function ctas() {
    return '<a class="btn solid" href="' + C.pdf + '">Download PDF ↓</a>' +
      '<a class="btn" href="mailto:' + C.email + '">Email</a>' +
      '<a class="btn" href="' + C.linkedin + '" target="_blank" rel="noopener">LinkedIn ↗</a>';
  }
  $("#cta").innerHTML = ctas();
  $("#cta2").innerHTML = ctas();

  $("#facts").innerHTML = C.facts.map(function (f) {
    return '<div class="fact"><span class="v" data-to="' + f.value + '" data-dec="' + f.decimals + '" data-suf="' + f.suffix + '">0</span><span class="lab u">' + t(f.unit) + '</span><span class="l">' + t(f.label) + "</span></div>";
  }).join("");

  var wi = 0;
  $("#about").innerHTML = '<p class="lead">' + t(C.tagline) + '</p><p class="read">' +
    C.about.join(" ").split(/\s+/).map(function (w) { return '<span class="w" data-i="' + (wi++) + '">' + K.esc(w) + "</span>"; }).join(" ") + "</p>";

  var n = C.jobs.length;
  $("#floors").innerHTML = C.jobs.map(function (j, i) {
    var floor = n - i;
    return '<article class="floor" style="--rev:' + (n - 1 - i) + '"><span class="f">F' + String(floor).padStart(2, "0") + '</span><span class="d">' + t(j.dates) + (j.place ? "<br>" + t(j.place) : "") + '</span><div class="body"><h3>' + t(j.title) + '</h3><p class="co">' + t(j.company) + "</p>" +
      (j.points.length ? "<ul>" + j.points.map(function (p) { return "<li>" + t(p) + "</li>"; }).join("") + "</ul>" : "") +
      (j.tags.length ? '<div class="tags">' + j.tags.map(function (g) { return "<span>" + t(g) + "</span>"; }).join("") + "</div>" : "") + "</div></article>";
  }).join("");

  $("#cards").innerHTML = C.highlights.map(function (h) {
    return '<div class="card"><span class="lab k">' + t(h.when) + "</span><h3>" + t(h.title) + "</h3><p>" + t(h.text) + "</p></div>";
  }).join("");
  var si = 0;
  $("#skills").innerHTML = C.skills.map(function (g) {
    return '<div class="sg"><span class="lab">' + t(g.group) + '</span><div class="tags2">' + g.items.map(function (s) { return '<span style="--i:' + (si++) + '">' + t(s) + "</span>"; }).join("") + "</div></div>";
  }).join("");
  $("#langs").innerHTML = '<p class="lab" style="margin:0 0 8px">Languages</p>' + C.languages.map(function (l) { return '<div class="kv"><span>' + t(l.name) + "</span><span>" + t(l.level) + "</span></div>"; }).join("");
  var e = C.education;
  $("#edu").innerHTML = '<p class="lab" style="margin:0 0 8px">Education</p><div class="kv"><span>' + t(e.title) + "</span><span>" + t(e.year) + '</span></div><div class="kv"><span>' + t(e.school) + "</span><span>" + t(e.place) + "</span></div>";
  var mail = $("#mail"); mail.href = "mailto:" + C.email; mail.textContent = C.email;
  $("#cmeta").innerHTML = "<span>" + t(C.location) + '</span><a href="' + C.linkedin + '" target="_blank" rel="noopener">' + t(C.linkedinLabel) + "</a>";

  /* ---------- Effect 4: rolling section numbers ---------- */
  $$("section").forEach(function (s) {
    var no = $(".no", s), txt = s.dataset.n;
    no.innerHTML = Array.from(txt).map(function (d, i) {
      var col = ""; for (var x = 0; x <= 9; x++) col += "<span>" + x + "</span>";
      return '<span class="col" data-d="' + d + '" style="--dl:' + (i * 0.15) + 's">' + col + "</span>";
    }).join("");
    K.onView(s, function () {
      s.classList.add("in");
      $$(".col", no).forEach(function (c) { c.style.transform = "translateY(" + (-c.dataset.d) + "em)"; });
    }, { threshold: 0.12 });
  });

  /* ---------- Reveals ---------- */
  K.reveal($$(".snap"), { threshold: 0.2 });
  K.reveal($("#floors"), { threshold: 0.08 });
  K.reveal($("#skills"), { threshold: 0.3 });
  K.onView($$(".fact"), function (f) {
    var v = $(".v", f);
    K.countUp(v, +v.dataset.to, { decimals: +v.dataset.dec, suffix: v.dataset.suf, duration: 1500 });
  }, { threshold: 0.6 });

  /* ---------- Effects 7, 9, 12: scroll-linked ---------- */
  var words = $$(".about .read .w"), read = $(".about .read"), img = $("#photo"), grid = $("#colgrid"), wide = window.matchMedia("(min-width: 961px)");
  if (K.reduced) words.forEach(function (w) { w.classList.add("lit"); });
  K.onScroll(function () {
    if (!K.reduced) {
      var p = K.progress(read, 0.85, 0.45), lit = Math.round(p * words.length);
      words.forEach(function (w, i) { w.classList.toggle("lit", i < lit); });
      if (wide.matches) img.style.setProperty("--py", (-window.scrollY * 0.04).toFixed(1) + "px");
    }
    var pp = K.pageProgress();
    img.style.setProperty("--gs", (1 - Math.max(0, (pp - 0.82) / 0.18) * 0.6).toFixed(3));
    grid.classList.toggle("quiet", pp > 0.03 && pp < 0.9);
    grid.classList.toggle("gone", pp >= 0.9);
  });

  K.previewBar("swiss");
})();
</script>
</body>
</html>
